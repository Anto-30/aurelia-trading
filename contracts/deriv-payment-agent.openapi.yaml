openapi: 3.1.0
info:
  title: AURELIA Deriv Payment Agent REST Contract
  version: 0.2.0
  contact:
    name: AURELIA project maintainers
    url: https://github.com/Anto-30/aurelia-trading
  description: |
    Safety-constrained AURELIA contract reconciled against the versioned official
    Deriv API schemas release production_v20260901_0. The exact source snapshot is
    pinned in x-aurelia-upstream-source below. Equality with the live endpoint
    https://api.derivws.com/data/production-openapi.json has not been verified;
    fetch and hash that endpoint before generating a runtime client. The pinned schema describes OAuth2 with the payment scope; PAT/header compatibility outside that specification is not assumed.

    SAFETY: default AURELIA mode is TEST_ONLY. This specification grants no external
    request permission. Tests must use fake HTTP transport; no real-money transfer,
    withdrawal, client privacy mutation, or verification-code dispatch is allowed.
    The production API hostname is not a sandbox.
servers:
  - url: https://api.derivws.com
    description: Official host for the production API; not a sandbox.
x-aurelia-upstream-source:
  source_url: https://raw.githubusercontent.com/deriv-com/deriv-api-schemas/production_v20260901_0/schemas/rest-api-openapi.json
  repository: deriv-com/deriv-api-schemas
  release_tag: production_v20260901_0
  git_commit: 54e353807146d31f58291693243cbbf671de7bce
  source_blob_sha: b785658de90b1c8010629f90b81c9441fa119f74
  sha256: 8a2655d9b9713f65296035ba02f8cf6f281ab95fcf454dd996b763a53506682f
  content_bytes: 241565
  captured_date_utc: "2026-10-25"
  scope: Payment Agent REST paths and referenced schemas from the versioned release snapshot
  direct_live_endpoint_identity_verified: false
  note: SHA-256 is computed over the exact UTF-8 content fetched from the pinned release URL; do not treat it as proof of identity with the live production-openapi.json endpoint.
tags:
  - name: Agent discovery
  - name: Client settings
  - name: Transfers
  - name: Withdrawals
security:
  - oauth2: [payment]
x-aurelia-safety-policy:
  specificationOnly: true
  defaultMode: TEST_ONLY
  liveMoneyWritesPermitted: false
  fakeTransportRequiredForTests: true
  forceDryRunForTransferPreflight: true
  denyInTestMode:
    - PATCH /payment-agents/v1/clients/me
    - POST /payment-agents/v1/withdraw/verification_code
    - POST /payment-agents/v1/withdraw
    - POST /payment-agents/v1/transfer when dry_run is not true
  preserveCanonicalLiveLock: config/LIVE_LOCK.yaml
  failClosedOnUnknown: true
  neverBlindlyResubmitAmbiguousWrite: true
x-aurelia-test-mode:
  default: TEST_ONLY
  authenticatedRestPolicy: "deny unless capital_plane_mode is exactly VERIFY_ONLY"
  realMoneyTransactionsPermitted: false
  verificationCodeDispatchPermitted: false
  clientPrivacyMutationsPermitted: false
  defaultTransport: mock_only
  liveMoneyWritesPermitted: false
  forceDryRunForTransferPreflight: true
  dryRunResultIsTransaction: false
  unknownStateAction: ABORT
paths:
  /payment-agents/v1/agent-statistics:
    get:
      operationId: getPaymentAgentStatistics
      tags: [Agent discovery]
      summary: Get supported agent countries and currencies
      description: Lists countries and currencies covered by active, publicly listed payment agents; results may lag newly onboarded agents.
      security:
        - oauth2: [payment]
      parameters: []
      responses:
        '200':
          description: Statistics returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatisticsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/agents:
    get:
      operationId: listPaymentAgents
      tags: [Agent discovery]
      summary: List agents for a currency
      description: Official paginated array of payment agents. The schema is matched to the pinned versioned source snapshot; live endpoint identity remains unverified.
      security:
        - oauth2: [payment]
      parameters:
        - name: currency
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Currency' }
        - name: country
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z]{2}$' }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        '200':
          description: Paginated list of payment agents matching the supplied filters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/agents/{id}:
    get:
      operationId: getPaymentAgent
      tags: [Agent discovery]
      summary: Get full payment-agent profile
      description: The literal id me returns the authenticated caller's own agent profile.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^(?:[1-9]\d*|me)$' }
      responses:
        '200':
          description: Full profile returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAgentEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/clients/me:
    get:
      operationId: getPaymentAgentClientSettings
      tags: [Client settings]
      summary: Read client's payment-agent settings
      description: Returns the caller's current deposit, withdrawal, and real-name visibility settings.
      parameters: []
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSettingsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
    patch:
      operationId: updatePaymentAgentClientPrivacySetting
      tags: [Client settings]
      summary: Change real-name visibility for payment agents
      description: Mutates a privacy preference. Denied in TEST_ONLY; any later use requires explicit human action.
      x-aurelia-default-mode: DENY
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [show_real_name]
                  properties:
                    show_real_name: { type: boolean }
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSettingsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/transfer:
    post:
      operationId: createPaymentAgentTransfer
      tags: [Transfers]
      summary: Transfer wallet funds from an eligible agent to a client
      description: |
        Agent-initiated deposit, not a general client self-deposit API. In TEST_ONLY
        no production transport may be called; if a future mock preflight builds a
        request, dry_run must be forced true. A dry_run_ok response means validation only.
        Never blindly retry an ambiguous write; reconcile by the same request_id.
      x-aurelia-default-mode: DENY_REAL_TRANSFER
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Complete, pending, or dry-run result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/transfer/{request_id}:
    get:
      operationId: getPaymentAgentTransferStatus
      tags: [Transfers]
      summary: Reconcile a transfer by its original request id
      description: Returns the current state of a transfer previously initiated with the same request_id.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current transfer status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferStatusEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/withdraw/verification_code:
    post:
      operationId: requestWithdrawalVerificationCode
      tags: [Withdrawals]
      summary: Request one-time verification code for an intended withdrawal
      description: Sends code to registered contact; an external side effect. Denied in TEST_ONLY and unit tests.
      x-aurelia-default-mode: DENY
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalVerificationRequest' }
      responses:
        '200':
          description: Verification-code dispatch confirmation and time bounds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalVerificationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/withdraw:
    post:
      operationId: createPaymentAgentWithdrawal
      tags: [Withdrawals]
      summary: Withdraw client Wallet funds through a payment agent
      description: |
        Moves funds out of client Deriv Wallet into agent Wallet; the agent's external
        settlement to the client is outside Deriv. Denied in TEST_ONLY. Requires a fresh
        six-digit verification code and unique request_id.
      x-aurelia-default-mode: DENY
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
      responses:
        '200':
          description: Initial withdrawal status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalStatusEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /payment-agents/v1/withdraw/{request_id}:
    get:
      operationId: getPaymentAgentWithdrawalStatus
      tags: [Withdrawals]
      summary: Reconcile a withdrawal by its original request id
      description: Returns the current state of a withdrawal previously initiated with the same request_id.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current withdrawal status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalStatusEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '504': { $ref: '#/components/responses/Timeout' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.deriv.com/oauth2/authorize
          tokenUrl: https://oauth.deriv.com/oauth2/token
          scopes:
            trade: Access to trading operations
            account_manage: Write access for account creation and management
            application_read: Read-only access to your registered applications
            payment: Access to payment agent deposit and withdrawal operations
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      description: Original idempotency key; never generate a replacement after ambiguous timeout.
      schema: { $ref: '#/components/schemas/RequestId' }
  responses:
    NotFound:
      description: Agent or request id not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Invalid parameters or business-rule failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Valid token lacks the required payment scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Internal service error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Timeout:
      description: Upstream timeout; reconcile write outcomes before further action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Currency:
      type: string
      pattern: '^[A-Z_]{1,18}$'
    Amount:
      type: string
      pattern: '^(?:0|[1-9]\d{0,13})(?:\.\d{1,18})?$'
      description: Decimal string; use Decimal semantics internally, not binary float.
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\w-]{1,128}$'
    Metadata:
      type: object
      required: [endpoint, method, timing]
      properties:
        endpoint: { type: string }
        method: { type: string, enum: [GET, POST, PUT, DELETE, PATCH] }
        timing: { type: number, minimum: 0 }
      additionalProperties: true
    ApiError:
      type: object
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
        detail:
          type: object
          properties:
            message: { type: string }
          additionalProperties: true
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data: { type: object, description: Always empty on error., additionalProperties: true }
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    StatisticsEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [available_countries, available_currencies]
          properties:
            available_countries:
              type: array
              items: { type: string, pattern: '^[a-z]{2}$' }
            available_currencies:
              type: array
              items: { $ref: '#/components/schemas/Currency' }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    AgentCurrency:
      type: object
      required: [currency]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        deposit_commission: { type: [number, 'null'] }
        withdrawal_commission: { type: [number, 'null'] }
        withdrawal_minimum: { type: [string, 'null'] }
        withdrawal_maximum: { type: [string, 'null'] }
      additionalProperties: true
    PaymentAgent:
      type: object
      required: [id, urls, currencies]
      properties:
        id: { type: integer, minimum: 1 }
        cashier_withdraw: { type: boolean }
        transfer_to_pa: { type: boolean }
        created_at: { type: integer, description: Epoch milliseconds. }
        is_listed: { type: boolean }
        name: { type: [string, 'null'] }
        nickname: { type: [string, 'null'] }
        information: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone_numbers: { type: [array, 'null'], items: { type: string } }
        payment_methods: { type: [array, 'null'], items: { type: string } }
        countries: { type: [array, 'null'], items: { type: string, pattern: '^[a-z]{2}$' } }
        urls: { type: [array, 'null'], items: { type: string, format: uri } }
        currencies: { type: array, items: { $ref: '#/components/schemas/AgentCurrency' } }
        deposit_enabled: { type: boolean }
        withdraw_enabled: { type: boolean }
      additionalProperties: true
    PaymentAgentEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data: { $ref: '#/components/schemas/PaymentAgent' }
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    ClientSettingsEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [deposit_enabled, withdraw_enabled, show_real_name]
          properties:
            deposit_enabled: { type: boolean }
            withdraw_enabled: { type: boolean }
            show_real_name: { type: boolean }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    TransferRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [to_nickname, amount, currency]
          properties:
            to_nickname: { type: string, minLength: 1 }
            amount: { $ref: '#/components/schemas/Amount' }
            currency: { $ref: '#/components/schemas/Currency' }
            notes: { type: string }
            request_id: { $ref: '#/components/schemas/RequestId' }
            dry_run:
              type: boolean
              description: Upstream optional flag. Test adapter must force true; external writes are forbidden.
          additionalProperties: false
      additionalProperties: false
    TransferEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [status, transaction_id, client_real_name, client_is_agent]
          properties:
            status: { type: string, enum: [complete, pending, dry_run_ok] }
            transaction_id: { type: [integer, 'null'] }
            client_real_name: { type: [string, 'null'] }
            client_is_agent: { type: boolean }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    TransferStatusEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [status, transaction_id]
          properties:
            status: { type: string, enum: [requested, pending, complete, rejected, failed] }
            transaction_id: { type: [integer, 'null'] }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    WithdrawalVerificationRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [agent_id, amount, currency]
          properties:
            agent_id: { type: integer, minimum: 1 }
            amount: { $ref: '#/components/schemas/Amount' }
            currency: { $ref: '#/components/schemas/Currency' }
          additionalProperties: false
      additionalProperties: false
    WithdrawalVerificationEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [message, next_request_at, expires_at]
          properties:
            message: { type: string }
            next_request_at: { type: integer, minimum: 0, description: Unix epoch seconds. }
            expires_at: { type: integer, minimum: 0, description: Unix epoch seconds. }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
    WithdrawalRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [agent_id, amount, currency, verification_code]
          properties:
            agent_id: { type: integer, minimum: 1 }
            amount: { $ref: '#/components/schemas/Amount' }
            currency: { $ref: '#/components/schemas/Currency' }
            verification_code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
            request_id: { $ref: '#/components/schemas/RequestId' }
            notes: { type: string }
          additionalProperties: false
      additionalProperties: false
    WithdrawalStatusEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: object
          required: [status, transaction_id]
          properties:
            status: { type: string, enum: [requested, pending, complete, rejected, failed] }
            transaction_id: { type: [integer, 'null'] }
          additionalProperties: true
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true

    PaymentAgentListItem:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        created_at: { type: integer, description: Epoch timestamp in milliseconds. }
        is_listed: { type: boolean }
        name: { type: [string, 'null'] }
        nickname: { type: [string, 'null'] }
        information: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phone_numbers: { type: [array, 'null'], items: { type: string } }
        payment_methods: { type: [array, 'null'], items: { type: string } }
        countries: { type: [array, 'null'], items: { type: string } }
        urls: { type: [array, 'null'], items: { type: string } }
        deposit_commission: { type: [number, 'null'] }
        withdrawal_commission: { type: [number, 'null'] }
        withdrawal_minimum: { type: [string, 'null'] }
        withdrawal_maximum: { type: [string, 'null'] }
      additionalProperties: true
    DirectoryEnvelope:
      type: object
      required: [data, errors, metadata]
      properties:
        data:
          type: array
          description: Payment agent list items sorted by agent ID ascending.
          items: { $ref: '#/components/schemas/PaymentAgentListItem' }
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
      additionalProperties: true
