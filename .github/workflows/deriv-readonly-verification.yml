name: Deriv authenticated read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deriv-readonly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-read-only:
    # Manual dispatch on main only. Production environment approval is recommended/required.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install required runtime dependencies
        run: pip install -r requirements.txt

      - name: Validate authenticated prerequisites without printing credentials
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE == 'oauth' && 'oauth' || vars.DERIV_AUTH_MODE == 'pat' && 'pat' || 'invalid' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_AUTH_PREREQUISITES_OUT: /tmp/aurelia-private/deriv_auth_prerequisites.json
        run: |
          mkdir -p /tmp/aurelia-private artifacts
          python scripts/deriv_auth_prerequisites.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/aurelia-private/deriv_auth_prerequisites.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("configured") is not True:
              print("DERIV_AUTH_PREREQUISITES=NOT_READY")
              raise SystemExit(2)
          print("DERIV_AUTH_PREREQUISITES=READY")
          PY

      - name: Verify real-account authenticated session (read only)
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE == 'oauth' && 'oauth' || vars.DERIV_AUTH_MODE == 'pat' && 'pat' || 'invalid' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: real
          DERIV_EVIDENCE_OUT: /tmp/aurelia-private/session.json
        run: python scripts/verify_deriv_session.py

      - name: Verify broker statement and portfolio (read only)
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE == 'oauth' && 'oauth' || vars.DERIV_AUTH_MODE == 'pat' && 'pat' || 'invalid' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: real
          DERIV_BROKER_EVIDENCE_OUT: /tmp/aurelia-private/broker.json
        run: python scripts/verify_deriv_broker_evidence.py

      - name: Verify control chain in VERIFY_ONLY mode (no order submission)
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE == 'oauth' && 'oauth' || vars.DERIV_AUTH_MODE == 'pat' && 'pat' || 'invalid' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: real
          DERIV_LIFECYCLE_MODE: VERIFY_ONLY
          DERIV_VERIFY_SYMBOL: R_100
          DERIV_VERIFY_STAKE: "1.0"
          DERIV_VERIFY_PROBABILITY: "0.60"
          DERIV_LIFECYCLE_EVIDENCE_OUT: /tmp/aurelia-private/lifecycle.json
        run: python scripts/verify_deriv_transaction_lifecycle.py

      - name: Build privacy-preserving verification summary
        run: |
          python scripts/sanitize_deriv_readonly_evidence.py \
            --session /tmp/aurelia-private/session.json \
            --broker /tmp/aurelia-private/broker.json \
            --lifecycle /tmp/aurelia-private/lifecycle.json \
            --out artifacts/deriv_readonly_evidence_summary.json

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deriv-readonly-sanitized-evidence
          path: artifacts/deriv_readonly_evidence_summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove private runner-local evidence
        if: always()
        run: |
          rm -rf /tmp/aurelia-private
          rm -f artifacts/deriv_auth_prerequisites.json
          rm -f /tmp/aurelia/lifecycle.ndjson
