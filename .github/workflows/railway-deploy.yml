name: AURELIA Railway Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    # Railway credential may be stored as a production environment secret.
    environment: production
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: da9da5a1-acd2-4af2-9fec-bf46e4d4252b
      RAILWAY_ENVIRONMENT_ID: bb95dc97-ad27-4b3a-8fa0-cf52df555a38
      RAILWAY_SERVICE_NAME: aurelia-production-worker
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - uses: actions/checkout@v7

      - name: Detect Railway deployment capability
        id: credential
        shell: bash
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOYMENT_STATUS=BLOCKED_EXTERNAL_CREDENTIAL"
            echo "REASON=RAILWAY_TOKEN is not configured; no Railway deployment will be attempted."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOYMENT_STATUS=CLI_AVAILABLE"
          fi

      - name: Local container startup and health smoke test
        run: |
          docker build --tag aurelia-runtime-smoke .
          docker run --detach --rm \
            --name aurelia-runtime-smoke \
            --publish 18080:8080 \
            --env AURELIA_NON_PRODUCTION_SOAK=true \
            --env AURELIA_CONTINUOUS_RUNTIME=false \
            --env AURELIA_VERIFY_DERIV_PUBLIC=false \
            --env AURELIA_VERIFY_DERIV_AUTH=false \
            --env AURELIA_RUN_ONCE=false \
            --env FINAL_EXECUTION_AUTHORIZATION=false \
            --env LIVE_EXECUTION=BLOCKED \
            aurelia-runtime-smoke

          cleanup() {
            docker stop aurelia-runtime-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/tmp/aurelia-health.json; then
              ready=1
              break
            fi
            sleep 2
          done

          test "$ready" = "1"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/aurelia-health.json").read_text())
          assert payload["liveness"] is True, payload
          assert payload["capital_can_open_new_exposure"] is False, payload
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Install Railway CLI
        if: steps.credential.outputs.available == 'true'
        run: npm install --global @railway/cli

      - name: Verify or provision the canonical Railway service
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID"

          service_json="$(railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json)"
          export service_json

          exists="$(python - <<'PY'
          import json, os
          payload=json.loads(os.environ["service_json"])
          services=payload.get("services", []) if isinstance(payload, dict) else payload
          target=os.environ["RAILWAY_SERVICE_NAME"]
          print("true" if any(isinstance(s,dict) and s.get("name")==target for s in services) else "false")
          PY
          )"

          if [ "$exists" != "true" ]; then
            echo "Canonical Railway worker is absent; creating the service from the existing AURELIA repository."
            railway add --service "$RAILWAY_SERVICE_NAME" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --yes
            railway service source connect               --project "$RAILWAY_PROJECT_ID"               --environment "$RAILWAY_ENVIRONMENT_ID"               --service "$RAILWAY_SERVICE_NAME"               --repo "Anto-30/aurelia-trading"               --branch "main"
          fi

          service_json="$(railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json)"
          export service_json
          python - <<'PY'
          import json, os, sys
          payload=json.loads(os.environ["service_json"])
          services=payload.get("services", []) if isinstance(payload,dict) else payload
          target=os.environ["RAILWAY_SERVICE_NAME"]
          match=next((s for s in services if isinstance(s,dict) and s.get("name")==target),None)
          if not match:
              print("RAILWAY_CANONICAL_SERVICE=BLOCKED")
              sys.exit(2)
          print(f"Railway service verified: {target}")
          PY

      - name: Provision production runtime configuration and protected Deriv secrets
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}" || { echo "BLOCKED_EXTERNAL_SECRET: Deriv PAT is not configured"; exit 2; }
          test -n "${{ secrets.DERIV_APP_ID }}" || { echo "BLOCKED_EXTERNAL_SECRET: Deriv App ID is not configured"; exit 2; }
          test -n "${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}" || { echo "BLOCKED_EXTERNAL_SECRET: expected Deriv account binding is not configured"; exit 2; }

          railway variable set             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_NAME"             "DERIV_AUTH_TOKEN=${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}"             "DERIV_APP_ID=${{ secrets.DERIV_APP_ID }}"             "DERIV_EXPECTED_LOGINID=${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}"             "DERIV_EXPECTED_CURRENCY=${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}"             "DERIV_ENVIRONMENT=real"             "DERIV_AUTH_MODE=${{ secrets.DERIV_AUTH_MODE || 'pat' }}"             "AURELIA_VERIFY_DERIV_AUTH=true"             "AURELIA_VERIFY_DERIV_PUBLIC=true"             "AURELIA_CONTINUOUS_RUNTIME=true"             "AURELIA_RUN_ONCE=false"             "FINAL_EXECUTION_AUTHORIZATION=false"             "LIVE_EXECUTION=BLOCKED"
          echo "Protected runtime configuration provisioned without printing secret values."

      - name: Deploy AURELIA runtime
        if: steps.credential.outputs.available == 'true'
        run: |
          railway up             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --service "$RAILWAY_SERVICE_NAME"             --ci

      - name: Wait for deployed health/startup state
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          deadline=$((SECONDS + 360))
          last_status="UNKNOWN"

          while [ "$SECONDS" -lt "$deadline" ]; do
            deployment_json="$(railway deployment list               --project "$RAILWAY_PROJECT_ID"               --environment "$RAILWAY_ENVIRONMENT_ID"               --service "$RAILWAY_SERVICE_NAME"               --limit 1               --json)"
            export deployment_json

            status="$(python - <<'PY'
            import json
            import os

            payload = json.loads(os.environ["deployment_json"])
            if isinstance(payload, dict):
                items = payload.get("deployments", [])
            else:
                items = payload
            print(items[0].get("status", "UNKNOWN") if items else "UNKNOWN")
            PY
            )"
            last_status="$status"
            echo "Latest Railway deployment status: $status"

            case "$status" in
              SUCCESS)
                break
                ;;
              FAILED|CRASHED|REMOVED|REMOVING)
                echo "Railway deployment failed with terminal status: $status"
                railway logs                   --project "$RAILWAY_PROJECT_ID"                   --environment "$RAILWAY_ENVIRONMENT_ID"                   --service "$RAILWAY_SERVICE_NAME"                   --latest                   --lines 200 || true
                exit 1
                ;;
            esac

            sleep 10
          done

          test "$last_status" = "SUCCESS"

      - name: Verify Railway runtime health and replica state
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          runtime_json="$(railway status             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT_ID"             --json)"
          export runtime_json

          python - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["runtime_json"])
          services = payload.get("services", []) if isinstance(payload, dict) else []
          target = os.environ["RAILWAY_SERVICE_NAME"]
          match = next((s for s in services if s.get("name") == target), None)

          if not match:
              print("RUNTIME_HEALTH_BLOCKED: service not present in Railway status.")
              sys.exit(2)

          deployment = match.get("latestDeployment") or match.get("latest_deployment") or {}
          status = str(deployment.get("status", "")).upper()
          replicas = match.get("numReplicas", match.get("replicas"))

          if status != "SUCCESS":
              print(f"RUNTIME_HEALTH_BLOCKED: latest deployment status={status!r}")
              sys.exit(2)

          if replicas is not None and int(replicas) < 1:
              print(f"RUNTIME_HEALTH_BLOCKED: replicas={replicas}")
              sys.exit(2)

          print(f"RUNTIME_OPERATIONAL_CHECK=PASS service={target} deployment={status} replicas={replicas}")
          PY

          {
            echo "## Railway deployment"
            echo ""
            echo "**Status:** DEPLOYED_AND_HEALTHCHECKED"
            echo ""
            echo "Local container startup and /health smoke test passed."
            echo "Railway deployment reached SUCCESS and the service runtime/replica check passed."
            echo ""
            echo "**Capital authorization remains:** `FINAL_EXECUTION_AUTHORIZATION=false`"
            echo "**Live execution remains:** `BLOCKED`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment state when external credential is unavailable
        if: steps.credential.outputs.available != 'true'
        run: |
          {
            echo "## Railway deployment"
            echo ""
            echo "**Status:** BLOCKED_EXTERNAL_CREDENTIAL"
            echo ""
            echo "The repository CI cannot deploy because RAILWAY_TOKEN is not configured."
            echo "The AURELIA capital-protection state remains unchanged."
            echo ""
            echo "**Important:** this is not a successful deployment. It is an explicit external-dependency block."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert capital protection
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"

      - name: Write non-secret Railway deployment evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          status="BLOCKED_EXTERNAL_CREDENTIAL"
          if [ "${{ steps.credential.outputs.available }}" = "true" ]; then
            status="DEPLOYMENT_ATTEMPTED"
          fi
          cat > artifacts/railway_deployment_evidence.json <<EOF
          {
            "schema": "aurelia.railway.deployment.evidence.v1",
            "status": "$status",
            "service": "$RAILWAY_SERVICE_NAME",
            "source_repository": "Anto-30/aurelia-trading",
            "source_branch": "main",
            "capital_protection": true,
            "final_execution_authorization": false,
            "live_execution": "BLOCKED"
          }
          EOF
          echo "RAILWAY_DEPLOYMENT_EVIDENCE_WRITTEN=true"

      - name: Upload non-secret Railway deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-railway-deployment-evidence
          path: artifacts/railway_deployment_evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Explicit capital protection marker
        if: always()
        run: |
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
          echo "LIVE_EXECUTION=BLOCKED"

# Deployment remains capital-protected until runtime verification succeeds.
