name: Synthetic Deriv Transport Recovery Matrix

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/verify_synthetic_recovery_matrix.py"
      - ".github/workflows/recovery-matrix-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-recovery-matrix
  cancel-in-progress: false

jobs:
  localhost-recovery:
    name: Localhost mock transport recovery (no broker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout code without persisting credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install only pinned WebSocket client
        run: python -m pip install --disable-pip-version-check --no-deps websockets==16.0

      - name: Validate recovery harness
        run: python -m py_compile tools/verify_synthetic_recovery_matrix.py

      - name: Run localhost-only failure injection and recovery matrix
        run: python tools/verify_synthetic_recovery_matrix.py --output-dir evidence/recovery_matrix_synthetic

      - name: Preserve synthetic recovery evidence and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-matrix
          path: evidence/recovery_matrix_synthetic/
          if-no-files-found: warn
          retention-days: 30
