name: AURELIA Dependency and Static Security Audit

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install audit tools and declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit

      - name: Audit declared requirements for known vulnerabilities
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "pip-audit found vulnerabilities or could not complete; inspect the uploaded report."
            exit "$status"
          fi

      - name: Run Bandit static analysis and fail on high-severity findings
        run: |
          set +e
          bandit -r runtime research scripts -ll -f json -o bandit-report.json
          status=$?
          set -e
          if [ "$status" -gt 1 ] || [ ! -s bandit-report.json ]; then
            echo "Bandit could not complete or did not produce a report."
            exit 2
          fi
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as handle:
              report = json.load(handle)

          results = report.get("results", [])
          counts = {
              severity: sum(item.get("issue_severity") == severity for item in results)
              for severity in ("HIGH", "MEDIUM", "LOW")
          }
          print("Bandit findings: " + ", ".join(f"{key}={value}" for key, value in counts.items()))
          if counts["HIGH"]:
              print("High-severity findings block this audit.")
              sys.exit(1)
          if counts["MEDIUM"]:
              print("Medium-severity findings require triage; see issue #134.")
          PY

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-security-audit-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          if-no-files-found: warn
          retention-days: 14
