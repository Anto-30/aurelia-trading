name: AURELIA Dependency and Static Security Audit

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install audit tools and declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit

      - name: Audit declared requirements for known vulnerabilities
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "pip-audit found vulnerabilities or could not complete; inspect the uploaded report."
            exit "$status"
          fi

      - name: Run Bandit high-severity static analysis
        run: |
          set +e
          bandit -r runtime research scripts -ll -f json -o bandit-report.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Bandit reported high-severity findings or could not complete; inspect the uploaded report."
            exit "$status"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-security-audit-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          if-no-files-found: warn
          retention-days: 14
