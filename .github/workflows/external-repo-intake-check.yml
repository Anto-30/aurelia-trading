name: External Repository Intake Guard

on:
  pull_request:
    branches: ["main"]
    paths:
      - "config/external_repo_federation.json"
      - "config/LIVE_LOCK.yaml"
      - "docs/EXTERNAL_REPOSITORY_INTAKE_2026-10-25.md"
      - ".github/workflows/external-repo-intake-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned intake, provenance, licenses, and fail-closed controls
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = set("aaif-goose/goose AbuZar-Ansarii/Hermes-Agent-On-Android Adamant-im/adamant-tradebot adebnar/hermes-android aide/aide Aider-AI/aider aiwebarchitects/hyperliquid_free_trading_bot amirghm/hermes-agent-mobile asba-IA/Github-Mev-Bot b-nnett/goose Binair-Dev/HermesAgentMobile cline/cline cline/prompts CMZ33/Github-Mev-Bot Codename-11/hermes-relay coder/agentapi cogwheel0/conduit composio-community/awesome-codex-skills CryptoSignal/Crypto-Signal Cryptotrademate/cryptotrademate-trading-bot decolua/9router df-tools-bn/.github didi/Hummer dsmsmj/vercel-labs-agent-skills dyad-sh/dyad elder-plinius/CL4R1T4S getpaseo/paseo Giton22/herald gooseworks-ai/goose-skills hackobi/AI-Scalpel-Trading-Bot Haehnchen/crypto-trading-bot HenWorks/Hermes-agent-android-PC-companion-app hermes-webui/hermes-android hotovo/aider-desk Hy4ri/hermes-mobile iamfakeguru/agent-md iOfficeAI/OfficeCLI jeromeleeqy-hash/Hermes-Android Jia-Ethan/codex-keysmith kevincm89/https-github.com-vercel-labs-skills koreainvestment/open-trading-api l3ad3r1/Hermes-Agent-Android learn-crypto-trading/learn-crypto-trading.github.io Loongphy/codex-auth marshallrichards/ClawPhone minhlucvan/agent-browser-mcp Mintplex-Labs/anythingllm-docs mz-automation/libiec61850 omarqaterge/hermes-mobile-app onchain-trading-bot/.github openai/codex-security OpenHands/automation OpenHands/extensions OpenHands/OpenHands OpenHands/openhands-aci OpenHands/OpenHands-CLI OpenHands/OpenHands-Cloud OpenHands/software-agent-sdk Options-Visualizer/Options-Visualizer.github.io pressly/goose Qian-Anton/GitStudy qxcnm/Codex-Manager reactnativecn/react-native-update Roibal/Cryptocurrency-Trading-Bots-Python-Beginner-Advance router-for-me/CLIProxyAPI rusty4444/hermes-android ryfineZ/codex-session-patcher sesaloy/hermes-mobile sesori-ai/sesori_apps_monorepo sidinsearch/AgentCall starwiz-7/StalkStock tag1consulting/goose traderwillhu/market_dashboard TradingAgents-AI/TradingAgents-AI.github.io TradingGoose/TradingGoose.github.io twentyhq/twenty unsupportedpastels/mercury x1xhlol/system-prompts-and-models-of-ai-tools Xiaofei-it/Hermes xP3ta/hermes-console zurb/twentytwenty".split())
          registry = json.loads(Path("config/external_repo_federation.json").read_text())
          lock_lines = {line.strip() for line in Path("config/LIVE_LOCK.yaml").read_text().splitlines()}
          required_lock_lines = {
              "live_trading_enabled: false",
              "FINAL_EXECUTION_AUTHORIZATION: false",
              "LIVE_EXECUTION: BLOCKED",
              "capital_plane_mode: VERIFY_ONLY",
              "research_capital_authority: false",
              "external_repositories_capital_forbidden: true",
          }
          assert required_lock_lines <= lock_lines, "LIVE_LOCK is missing required fail-closed controls"
          repos = registry["repositories"]
          by_name = {item["repo"]: item for item in repos}

          assert len(by_name) == len(repos), "duplicate repository identifiers in registry"
          controls = registry["global_controls"]
          assert controls["capital_authority"] is False
          assert controls["live_order_submission"] is False
          assert controls["secret_reading"] is False
          assert controls["external_code_execution"] == "DENY_BY_DEFAULT"

          allowed_modes = {"RESEARCH_ONLY", "SANDBOX_ONLY", "TOOLCHAIN_ONLY", "REFERENCE_ONLY"}
          for item in repos:
              name = item.get("repo", "<missing>")
              assert item.get("mode") in allowed_modes, f"invalid mode: {name}"
              assert item.get("source_url", "").startswith("https://github.com/"), f"invalid source URL: {name}"
              assert item.get("capital_authority", False) is False, f"capital authority must remain false: {name}"

          missing = sorted(expected - set(by_name))
          assert len(expected) == 81, f"expected intake candidate count must be 81, got {len(expected)}"
          assert not missing, f"expected candidate(s) absent: {missing}"
          assert expected <= set(by_name), "one or more expected intake candidates are absent"
          for name in expected:
              item = by_name[name]
              sha = item.get("head_commit", "")
              assert re.fullmatch(r"[0-9a-f]{40}", sha), f"not pinned to full 40-character SHA: {name}"
              assert item.get("upstream_default_branch"), f"default branch metadata missing: {name}"
              assert isinstance(item.get("upstream_archived"), bool), f"archive metadata missing: {name}"
              assert "upstream_license_spdx" in item and item.get("upstream_license_evidence"), f"license evidence metadata missing: {name}"
              expected_url = item["source_url"].rstrip("/") + "/commit/" + sha
              assert item.get("pin_source") == expected_url, f"pin source does not match SHA: {name}"
              assert item.get("intake_status") in {"UNREVIEWED", "BLOCKED"}, f"candidate cannot be promoted by intake PR: {name}"

          required_blocked = {
              "AbuZar-Ansarii/Hermes-Agent-On-Android",
              "Adamant-im/adamant-tradebot",
              "adebnar/hermes-android",
              "aiwebarchitects/hyperliquid_free_trading_bot",
              "amirghm/hermes-agent-mobile",
              "asba-IA/Github-Mev-Bot",
              "b-nnett/goose",
              "Binair-Dev/HermesAgentMobile",
              "cline/prompts",
              "CMZ33/Github-Mev-Bot",
              "Codename-11/hermes-relay",
              "coder/agentapi",
              "cogwheel0/conduit",
              "composio-community/awesome-codex-skills",
              "CryptoSignal/Crypto-Signal",
              "Cryptotrademate/cryptotrademate-trading-bot",
              "df-tools-bn/.github",
              "dsmsmj/vercel-labs-agent-skills",
              "elder-plinius/CL4R1T4S",
              "getpaseo/paseo",
              "Giton22/herald",
              "hackobi/AI-Scalpel-Trading-Bot",
              "Haehnchen/crypto-trading-bot",
              "HenWorks/Hermes-agent-android-PC-companion-app",
              "hermes-webui/hermes-android",
              "Hy4ri/hermes-mobile",
              "jeromeleeqy-hash/Hermes-Android",
              "kevincm89/https-github.com-vercel-labs-skills",
              "koreainvestment/open-trading-api",
              "l3ad3r1/Hermes-Agent-Android",
              "marshallrichards/ClawPhone",
              "minhlucvan/agent-browser-mcp",
              "omarqaterge/hermes-mobile-app",
              "onchain-trading-bot/.github",
              "OpenHands/openhands-aci",
              "OpenHands/OpenHands-Cloud",
              "Options-Visualizer/Options-Visualizer.github.io",
              "Qian-Anton/GitStudy",
              "qxcnm/Codex-Manager",
              "reactnativecn/react-native-update",
              "Roibal/Cryptocurrency-Trading-Bots-Python-Beginner-Advance",
              "router-for-me/CLIProxyAPI",
              "rusty4444/hermes-android",
              "ryfineZ/codex-session-patcher",
              "sesaloy/hermes-mobile",
              "sesori-ai/sesori_apps_monorepo",
              "sidinsearch/AgentCall",
              "starwiz-7/StalkStock",
              "traderwillhu/market_dashboard",
              "TradingAgents-AI/TradingAgents-AI.github.io",
              "TradingGoose/TradingGoose.github.io",
              "twentyhq/twenty",
              "unsupportedpastels/mercury",
              "x1xhlol/system-prompts-and-models-of-ai-tools",
              "Xiaofei-it/Hermes",
              "xP3ta/hermes-console",
          }
          for name in required_blocked:
              assert by_name[name]["intake_status"] == "BLOCKED", f"required blocker was removed: {name}"
          for item in repos:
              if item["repo"] in required_blocked:
                  assert item["intake_status"] == "BLOCKED"
          assert by_name["coder/agentapi"]["mode"] == "REFERENCE_ONLY"
          assert by_name["qxcnm/Codex-Manager"]["mode"] == "REFERENCE_ONLY"
          assert by_name["router-for-me/CLIProxyAPI"]["mode"] == "REFERENCE_ONLY"
          assert "refusal" in by_name["ryfineZ/codex-session-patcher"]["integration_note"].lower()
          assert "root" in by_name["qxcnm/Codex-Manager"]["integration_note"].lower()
          assert "ports" in by_name["router-for-me/CLIProxyAPI"]["integration_note"].lower()
          assert by_name["OpenHands/openhands-aci"]["mode"] == "REFERENCE_ONLY"
          assert by_name["OpenHands/OpenHands-Cloud"]["upstream_license_spdx"] == "PolyForm-Free-Trial-1.0.0"
          assert by_name["Roibal/Cryptocurrency-Trading-Bots-Python-Beginner-Advance"]["intake_status"] == "BLOCKED"
          assert by_name["x1xhlol/system-prompts-and-models-of-ai-tools"]["intake_status"] == "BLOCKED"
          assert by_name["elder-plinius/CL4R1T4S"]["intake_status"] == "BLOCKED"
          assert "FSL-1.1-ALv2" in by_name["dyad-sh/dyad"]["upstream_license_spdx"]
          assert by_name["Haehnchen/crypto-trading-bot"]["intake_status"] == "BLOCKED"
          assert by_name["HenWorks/Hermes-agent-android-PC-companion-app"]["intake_status"] == "BLOCKED"
          assert by_name["didi/Hummer"]["intake_status"] == "UNREVIEWED"
          assert by_name["sidinsearch/AgentCall"]["intake_status"] == "BLOCKED"
          assert by_name["sesori-ai/sesori_apps_monorepo"]["intake_status"] == "BLOCKED"
          assert by_name["reactnativecn/react-native-update"]["intake_status"] == "BLOCKED"
          assert by_name["getpaseo/paseo"]["upstream_license_spdx"] == "NOASSERTION"

          print("INTAKE_POLICY=PASS")
          print(f"REGISTRY_RECORDS={len(repos)}")
          print(f"CANDIDATES_PINNED={len(expected)}/{len(expected)}")
          assert len(required_blocked) == 56, f"expected 56 required blockers, got {len(required_blocked)}"
          print(f"CANDIDATES_BLOCKED={len(required_blocked)}")
          print("LIVE_LOCK=FAIL_CLOSED")
          PY
