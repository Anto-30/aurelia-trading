name: Repository Intake Supply-Chain Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "config/external_repo_federation.json"
      - "docs/repository-intake-**"
      - ".github/workflows/repository-intake-supply-chain-audit.yml"
  push:
    branches:
      - research/repository-intake-2026-10-13
    paths:
      - "config/external_repo_federation.json"
      - "docs/repository-intake-**"
      - ".github/workflows/repository-intake-supply-chain-audit.yml"
  workflow_dispatch:

permissions: {}

jobs:
  pinned-source-audit:
    name: Pinned-source inventory, OSV, and license scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download exact pinned snapshots and inventory manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pinned-intake-sources /tmp/pinned-intake-audit
          python - <<'PY'
          import hashlib, io, json, pathlib, re, stat, time, urllib.request, zipfile

          repositories = [
              ("pasky/chrome-cdp-skill", "ffea76a24b0471663ddd9d9f24335bbc442b6266"),
              ("anthropics/claude-quickstarts", "9ec32b91df50b0d4906cae64b13c6298055ff40d"),
              ("siteboon/claudecodeui", "7c3049fe8e157f12b7add3e496d8d2fe6fa5c014"),
              ("ChrisWiles/claude-code-showcase", "a95518f0cb67e86230119da40429169bc4c35a6f"),
              ("decebals/claude-code-java", "0d98fe9bd62923e819568ee1e041a1bf320f74d4"),
              ("d-kimuson/claude-code-viewer", "9367cf006be9965c954e6cd36526f2195dce67ea"),
              ("intel/auto-round", "4663212ac4fd18be2b4ec4fa7c79c6e2e6fa9ce1"),
              ("D4Vinci/Scrapling", "7a684934907a8c7feaafe9ff1ccfd9d45cc26faf"),
              ("cyberchitta/scrapling-fetch-mcp", "8ed4c0df0979ca758e6e13ae84e6cdbe129e1a7a"),
              ("popiliadam/platinum-seo-engine", "ffdf24da84cd5d52f755f156707d9bd14f7c0135"),
          ]
          source_root = pathlib.Path("/tmp/pinned-intake-sources")
          report_root = pathlib.Path("/tmp/pinned-intake-audit")
          max_archive = 80 * 1024 * 1024
          max_total_download = 450 * 1024 * 1024
          max_member = 30 * 1024 * 1024
          max_total_uncompressed = 1200 * 1024 * 1024
          max_members_per_archive = 35000
          total_download = total_uncompressed = 0
          manifest_names = {
              "package.json","package-lock.json","npm-shrinkwrap.json","pnpm-lock.yaml","yarn.lock",
              "pyproject.toml","poetry.lock","uv.lock","pdm.lock","requirements.txt","requirements-dev.txt",
              "requirements-assurance.txt","pipfile","pipfile.lock","setup.cfg","setup.py","go.mod","go.sum",
              "cargo.toml","cargo.lock","composer.json","composer.lock","gemfile","gemfile.lock",
              "pom.xml","build.gradle","build.gradle.kts","gradle.lockfile","mix.lock","pubspec.yaml","pubspec.lock",
          }
          def is_license(name):
              b = pathlib.PurePosixPath(name).name.lower()
              return b in {"unlicense","authors"} or bool(re.match(r"^(license|licence|copying|copyright|notice)(\.|$|-|_)", b))
          report = {"audit": "read-only pinned source download and manifest/license inventory", "started_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "source_execution": "NONE", "dependency_installation_from_targets": "NONE", "repos": [], "limits": {"max_archive_bytes": max_archive, "max_member_bytes": max_member, "max_total_download_bytes": max_total_download, "max_total_uncompressed_bytes": max_total_uncompressed}}
          for repo, sha in repositories:
              row = {"repo": repo, "pinned_sha": sha, "archive_sha256": None, "archive_bytes": None, "files_extracted": 0, "manifests": [], "license_notice_paths": [], "large_files_skipped": [], "skipped_symlinks": [], "warnings": [], "errors": []}
              try:
                  url = f"https://codeload.github.com/{repo}/zip/{sha}"
                  req = urllib.request.Request(url, headers={"User-Agent":"AURELIA-repository-intake-audit/1.0"})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read(max_archive + 1)
                  if len(raw) > max_archive:
                      raise ValueError("archive exceeded configured download cap")
                  total_download += len(raw)
                  if total_download > max_total_download:
                      raise ValueError("total download cap exceeded")
                  row["archive_bytes"] = len(raw)
                  row["archive_sha256"] = hashlib.sha256(raw).hexdigest()
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      infos = archive.infolist()
                      if len(infos) > max_members_per_archive:
                          raise ValueError(f"archive member count over cap: {len(infos)}")
                      prefix = infos[0].filename.split("/",1)[0] + "/" if infos else ""
                      base_out = source_root / repo.replace("/", "__")
                      for info in infos:
                          if info.is_dir():
                              continue
                          original = info.filename
                          relative = original[len(prefix):] if prefix and original.startswith(prefix) else original
                          path = pathlib.PurePosixPath(relative)
                          if not relative or path.is_absolute() or any(part in ("..","") for part in path.parts):
                              row["errors"].append("unsafe or invalid archive path rejected")
                              continue
                          mode = (info.external_attr >> 16) & 0o170000
                          if mode == stat.S_IFLNK:
                              row["skipped_symlinks"].append(relative[:200])
                              continue
                          low = path.name.lower()
                          if low in manifest_names:
                              row["manifests"].append(relative)
                          if is_license(relative):
                              row["license_notice_paths"].append(relative)
                          if info.file_size > max_member:
                              row["large_files_skipped"].append({"path":relative,"bytes":info.file_size})
                              continue
                          total_uncompressed += info.file_size
                          if total_uncompressed > max_total_uncompressed:
                              raise ValueError("total uncompressed member cap exceeded")
                          target = base_out.joinpath(*path.parts)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with archive.open(info, "r") as src, target.open("wb") as dst:
                              copied = 0
                              while True:
                                  block = src.read(1024 * 1024)
                                  if not block: break
                                  copied += len(block)
                                  if copied > max_member:
                                      raise ValueError("member exceeded streamed extraction cap")
                                  dst.write(block)
                          row["files_extracted"] += 1
                  row["manifests"] = sorted(set(row["manifests"]))
                  row["license_notice_paths"] = sorted(set(row["license_notice_paths"]))
                  row["root_license_notice_found"] = any("/" not in p for p in row["license_notice_paths"])
              except Exception as exc:
                  row["errors"].append(type(exc).__name__ + ": " + str(exc)[:350])
              report["repos"].append(row)
          report["total_archive_bytes"] = total_download
          report["total_uncompressed_bytes"] = total_uncompressed
          report["finished_utc"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          (report_root / "source-inventory.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"repo_count":len(report["repos"]), "downloaded":sum(not r["errors"] for r in report["repos"]), "errors":{r["repo"]:r["errors"] for r in report["repos"] if r["errors"]}, "total_archive_bytes":total_download}, indent=2))
          PY

      - name: Install pinned ScanCode scanner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir "scancode-toolkit==32.5.0"

      - name: Scan source for license and package evidence (source code is not executed)
        shell: bash
        run: |
          set +e
          scancode --classify --license --copyright --package --summary --processes 2 --timeout 120 --json-pp /tmp/pinned-intake-audit/scancode-report.json /tmp/pinned-intake-sources > /tmp/pinned-intake-audit/scancode.log 2>&1
          status=$?
          echo "$status" > /tmp/pinned-intake-audit/scancode.exit
          echo "ScanCode exit status: $status"
          if [ -f /tmp/pinned-intake-audit/scancode-report.json ]; then
            echo "ScanCode JSON report written."
          else
            echo "ScanCode report missing; see scancode.log."
          fi
          exit 0

      - name: Download and verify official OSV-Scanner binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output /tmp/osv-scanner
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum --check -
          chmod 0755 /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Scan lockfiles and known vulnerability advisories
        shell: bash
        run: |
          set +e
          /tmp/osv-scanner scan source --recursive /tmp/pinned-intake-sources --format json --output-file /tmp/pinned-intake-audit/osv-report.json > /tmp/pinned-intake-audit/osv-scanner.log 2>&1
          status=$?
          echo "$status" > /tmp/pinned-intake-audit/osv.exit
          echo "OSV-Scanner exit status: $status"
          if [ -f /tmp/pinned-intake-audit/osv-report.json ]; then
            echo "OSV report written."
          else
            echo "OSV report missing; see osv-scanner.log."
          fi
          exit 0

      - name: Summarize report completeness and findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path("/tmp/pinned-intake-audit")
          summary=[]
          invpath=root/"source-inventory.json"
          inventory=json.loads(invpath.read_text()) if invpath.exists() else {}
          repos=inventory.get("repos",[])
          errors=[f"{r.get('repo')}: {e}" for r in repos for e in r.get("errors",[])]
          skipped=[f"{r.get('repo')}: {p}" for r in repos for p in r.get("skipped_symlinks",[])]
          manifests=sum(len(r.get("manifests",[])) for r in repos)
          license_paths=sum(len(r.get("license_notice_paths",[])) for r in repos)
          complete=sum(bool(r.get("archive_sha256")) and not r.get("errors") for r in repos)
          summary += ["## Pinned-source supply-chain audit","",f"- Pinned source archives downloaded and inventoried without hard errors: {complete} / {len(repos)}",f"- Source archive bytes: {inventory.get('total_archive_bytes','unknown')}",f"- Manifest/lockfile candidates: {manifests}",f"- License/NOTICE-like paths inventoried: {license_paths}","- Target source code was not executed and target-repository dependencies were not installed.","- Scope is ten exact pinned snapshots. Symlinks and oversized members were excluded; unsupported manifest formats and dependencies outside recognized lockfiles may not be represented.",""]
          if errors: summary += ["### Source inventory errors"] + [f"- {x}" for x in errors[:50]] + [""]
          if skipped: summary += ["### Skipped symlinks (inventory limitation)"] + [f"- {x}" for x in skipped[:50]] + [""]
          scancode_exit=(root/"scancode.exit").read_text().strip() if (root/"scancode.exit").exists() else "not-run"
          osv_exit=(root/"osv.exit").read_text().strip() if (root/"osv.exit").exists() else "not-run"
          summary += [f"- ScanCode process exit status: {scancode_exit}",f"- OSV-Scanner process exit status: {osv_exit}"]
          results=[]
          osvpath=root/"osv-report.json"
          try:
              raw=json.loads(osvpath.read_text()); results=raw.get("results",[])
          except Exception as e: summary.append(f"- OSV report parse error: {type(e).__name__}: {e}")
          repo_stats={}; vulnerable_coords=set(); advisory_ids=set(); vuln_records=0; top_by_coord={}
          for result in results:
              path=result.get("source",{}).get("path",""); repo="unknown"; rel=path
              for rr in repos:
                  prefix="/tmp/pinned-intake-sources/"+rr.get("repo","").replace("/","__")+"/"
                  if path.startswith(prefix): repo=rr["repo"]; rel=path[len(prefix):]; break
              stat=repo_stats.setdefault(repo,{"paths":set(),"coords":set(),"records":0,"ids":set(),"max":0.0})
              stat["paths"].add(rel)
              for p in result.get("packages",[]) or []:
                  pkg=p.get("package",{}) or {}; eco=pkg.get("ecosystem","unknown"); name=pkg.get("name","unknown"); ver=pkg.get("version","unknown")
                  vulns=p.get("vulnerabilities",[]) or []; sev=0.0
                  for group in p.get("groups",[]) or []:
                      try: sev=max(sev,float(group.get("max_severity") or 0))
                      except (ValueError,TypeError): pass
                  stat["max"]=max(stat["max"],sev)
                  if vulns: vulnerable_coords.add((eco,name,ver)); stat["coords"].add((eco,name,ver))
                  for v in vulns:
                      vuln_records+=1; stat["records"]+=1
                      if v.get("id"): advisory_ids.add(v["id"]); stat["ids"].add(v["id"] )
                      for alias in v.get("aliases",[]) or []:
                          if isinstance(alias,str): advisory_ids.add(alias); stat["ids"].add(alias)
                      key=(eco,name,ver); aliases=sorted(set(a for a in (v.get("aliases",[]) or []) if isinstance(a,str)))[:6]
                      old=top_by_coord.get(key)
                      if old is None or sev>old["severity"]:
                          top_by_coord[key]={"repo":repo,"path":rel,"ecosystem":eco,"name":name,"version":ver,"severity":sev,"advisory":v.get("id","unknown"),"aliases":aliases,"summary":(v.get("summary") or "").replace("\n"," ")[:170]}
          summary += [f"- OSV lockfile/requirement result paths with advisories: {len(results)}",f"- Distinct vulnerable package coordinates (ecosystem/name/version): {len(vulnerable_coords)}",f"- Vulnerability records (some advisories may appear through aliases or across manifests): {vuln_records}",f"- Distinct advisory IDs and aliases in report: {len(advisory_ids)}","- These records describe upstream candidate repositories, including demo, example, development, or test manifests where present. They are not evidence that any package is installed in AURELIA runtime.","","### OSV findings by upstream repository"]
          for repo,st in sorted(repo_stats.items(),key=lambda x:(-x[1]["records"],x[0])):
              summary.append(f"- {repo}: {len(st['paths'])} result paths; {len(st['coords'])} vulnerable coordinates; {st['records']} vulnerability records; max reported group severity {st['max']:.1f}")
          summary += ["","### Highest reported package-level severities (deduplicated by coordinate)"]
          for item in sorted(top_by_coord.values(),key=lambda x:(-x["severity"],x["repo"],x["ecosystem"],x["name"]))[:15]:
              summary.append(f"- {item['severity']:.1f} — {item['repo']} — {item['ecosystem']}:{item['name']}@{item['version']}; advisory {item['advisory']}; path {item['path']}. {item['summary']}")
          scpath=root/"scancode-report.json"
          if scpath.exists():
              try:
                  sc=json.loads(scpath.read_text()); files=sc.get("files",[]); found=[]
                  for f in files:
                      if not isinstance(f,dict): continue
                      for det in f.get("license_detections",[]) or []:
                          if isinstance(det,dict):
                              expr=det.get("license_expression") or det.get("license_expression_spdx")
                              if expr: found.append(expr)
                      ex=f.get("license_expressions",[]) or []
                      if isinstance(ex,str): found.append(ex)
                      elif isinstance(ex,list): found.extend(x for x in ex if isinstance(x,str))
                  counts={}
                  for expr in found: counts[expr]=counts.get(expr,0)+1
                  summary += ["","### ScanCode license-expression detections (not legal clearance)",f"- Files represented in JSON: {len(files)}",f"- License-expression detections tallied: {len(found)}"]
                  summary += [f"- {expr}: {count}" for expr,count in sorted(counts.items(),key=lambda x:(-x[1],x[0]))[:20]]
              except Exception as e: summary.append(f"- ScanCode report parse error: {type(e).__name__}: {e}")
          else: summary.append("- ScanCode JSON report missing; license scan did not complete.")
          summary += ["","### Gate disposition","- The gate remains BLOCKED if OSV reports vulnerable versions, the inventory is incomplete, ScanCode fails, or reports cannot be interpreted.","- Validate exact direct/transitive reachability, affected-version ranges, severity, and fixed releases before recommending reuse or remediation.","- Dynamic auth/SSRF/redirect/DNS-rebinding/regex/egress/browser-session tests and legal license review remain separate gates."]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary)+"\n")
          (root/"audit-summary.md").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY
      - name: Upload scan evidence (14-day retention)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-intake-supply-chain-audit
          path: /tmp/pinned-intake-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce complete inventory and audit acceptance criteria
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("/tmp/pinned-intake-audit"); problems=[]
          inv=root/"source-inventory.json"
          if not inv.exists(): problems.append("source inventory missing")
          else:
              report=json.loads(inv.read_text()); repos=report.get("repos",[])
              if len(repos)!=10: problems.append(f"inventory includes {len(repos)} of 10 pinned repositories")
              for r in repos:
                  if r.get("errors") or not r.get("archive_sha256"): problems.append(r.get("repo","unknown")+" archive inventory incomplete: "+str(r.get("errors",[])))
          sx=root/"scancode.exit"; sr=root/"scancode-report.json"
          if not sx.exists() or sx.read_text().strip()!="0": problems.append("ScanCode did not complete cleanly (exit "+(sx.read_text().strip() if sx.exists() else "missing")+"); inspect scancode.log")
          if not sr.exists(): problems.append("ScanCode JSON report missing")
          ox=root/"osv.exit"; op=root/"osv-report.json"
          if not ox.exists(): problems.append("OSV-Scanner exit status missing")
          elif ox.read_text().strip() not in {"0","1"}: problems.append("OSV-Scanner process failure, exit "+ox.read_text().strip())
          if not op.exists(): problems.append("OSV-Scanner JSON report missing")
          else:
              try:
                  data=json.loads(op.read_text()); results=data.get("results",[])
                  records=sum(len(p.get("vulnerabilities",[]) or []) for r in results for p in (r.get("packages",[]) or []))
                  coords={(p.get("package",{}).get("ecosystem"),p.get("package",{}).get("name"),p.get("package",{}).get("version")) for r in results for p in (r.get("packages",[]) or []) if p.get("vulnerabilities")}
                  if records: problems.append(f"OSV reported {records} vulnerability records across {len(coords)} distinct vulnerable package coordinates")
                  elif ox.exists() and ox.read_text().strip()!="0": problems.append("OSV returned a non-zero status with no vulnerability records; inspect raw logs")
              except Exception as e: problems.append("OSV report parse failed: "+type(e).__name__+": "+str(e))
          if problems:
              print("AUDIT GATE: BLOCKED")
              for p in problems: print("- "+p)
              sys.exit(1)
          print("AUDIT GATE: passed scanner process and source inventory checks with no detected vulnerability records; independent license interpretation and dynamic tests still required.")
          PY
