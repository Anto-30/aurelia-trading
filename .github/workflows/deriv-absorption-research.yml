name: Deriv Absorption Research (Public Data Only)

on:
  push:
    branches:
      - research/deriv-tick-momentum-absorption-20261020
  pull_request:
    branches: [main]
    paths:
      - 'research/labs/**'
      - 'run_wfo.py'
      - 'requirements-research.txt'
      - '.github/workflows/deriv-absorption-research.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deriv-absorption-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-history-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      DERIV_RESEARCH_SYMBOL: R_75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt -r requirements-research.txt
      - name: Run isolated research unit tests
        run: python -m unittest discover -s research/labs/tests -p 'test_*.py' -v
      - name: Fetch six months of public one-minute candles
        run: |
          python -m research.labs.deriv_history_fetcher \
            --symbol "$DERIV_RESEARCH_SYMBOL" \
            --days 180 \
            --granularity 60 \
            --out R75_6months_1min.csv | tee deriv_history_report.json
      - name: Run walk-forward screens
        run: |
          python run_wfo.py \
            --csv R75_6months_1min.csv \
            --out wf_deriv_absorption \
            --contract-type all \
            --tick-size 0.01 | tee walk_forward_console.json
      - name: Upload immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-absorption-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            R75_6months_1min.csv
            deriv_history_report.json
            walk_forward_console.json
            wf_deriv_absorption/
          if-no-files-found: warn
          retention-days: 30
