name: Agent Worker JSONL Protocol Tests

on:
  push:
    branches:
      - fix/require-provider-process-for-agent-liveness-2026-10-12
  pull_request:
    branches:
      - main
    paths:
      - "runtime/agent_workers.py"
      - "tests/test_agent_workers.py"
      - "requirements-test.in"
      - "requirements-test.lock"
      - ".github/workflows/agent-worker-protocol-tests.yml"

permissions:
  contents: read

concurrency:
  group: agent-worker-jsonl-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-jsonl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LIVE_EXECUTION: "BLOCKED"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      AURELIA_VERIFY_ONLY: "true"
      AURELIA_ALLOW_LIVE_ORDERS: "false"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Run worker JSONL protocol regressions
        run: python -m pytest -q tests/test_agent_workers.py
