name: Research Intake Register Check

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/research/repository-intake-and-agent-assignments-2026-10-14.md"
      - ".github/workflows/research-intake-register-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-intake-register-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-register:
    name: Validate repository register (no third-party code execution)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out AURELIA documentation
        uses: actions/checkout@v4
      - name: Validate inventory and safety boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("docs/research/repository-intake-and-agent-assignments-2026-10-14.md")
          if not path.is_file():
              sys.exit(f"FAIL: missing intake document: {path}")
          text = path.read_text(encoding="utf-8")
          start_marker = "## 3. Repository intake register"
          end_marker = "## 4. Recommended execution sequence"
          if start_marker not in text or end_marker not in text:
              sys.exit("FAIL: inventory section markers are missing")
          section = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          urls = re.findall(r"https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", section)
          unique = sorted(set(url.rstrip(".") for url in urls))
          if len(urls) != 23 or len(unique) != 23:
              sys.exit(f"FAIL: expected 23 unique upstream URLs; found {len(urls)} URLs and {len(unique)} unique")
          if "LIVE_LOCK" not in text or "no capital authority" not in text:
              sys.exit("FAIL: explicit capital-safety boundary missing")
          if "production qualification" not in text.lower():
              sys.exit("FAIL: production qualification boundary missing")
          print("PASS: 23 unique repository URLs recorded")
          print("PASS: capital-safety and production-qualification boundaries documented")
          print("INFO: no upstream repository code, dependencies, scripts, or credentials were executed or accessed")
          PY
