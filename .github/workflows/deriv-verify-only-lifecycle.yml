name: AURELIA Deriv Lifecycle Gate (Disabled Without Read-Only Scope)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-gate:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_DERIV_AUTH_MODE: "none"
      DERIV_LIFECYCLE_MODE: "VERIFY_ONLY"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run account lifecycle gate
        run: |
          set +e
          python scripts/verify_deriv_transaction_lifecycle.py
          status=$?
          set -e
          test "$status" -eq 2
      - name: Preserve capital lock
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          echo "DERIV_TRANSACTION_LIFECYCLE=BLOCKED"
          echo "CAPITAL_AUTHORITY_GRANTED=false"
          echo "ORDERS_SUBMITTED=0"
