name: AURELIA Deriv Verify-Only Lifecycle (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report account-scope policy block
        run: |
          echo "DERIV_TRANSACTION_LIFECYCLE=BLOCKED"
          echo "REASON=DERIV_READ_ONLY_ACCOUNT_SCOPE_UNAVAILABLE"
          echo "DERIV_PROPOSALS_REQUESTED=0"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
