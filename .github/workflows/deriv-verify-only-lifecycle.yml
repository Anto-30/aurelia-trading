name: AURELIA Deriv Verify-Only Lifecycle (Held)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain lifecycle gate
        run: |
          echo "DERIV_TRANSACTION_LIFECYCLE=HELD"
          echo "REASON=VERIFY_ONLY_LIFECYCLE_REQUIRES_SEPARATE_NO_ORDER_ACTION_AUDIT"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
