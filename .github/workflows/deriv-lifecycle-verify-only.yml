name: AURELIA Deriv Verify-Only Lifecycle Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-deriv-verify-only-lifecycle
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN }}
      DERIV_PAT: ${{ secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID }}
      DERIV_AUTHORIZED_ACCOUNT_ID: ${{ secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}
      DERIV_ENVIRONMENT: real
      DERIV_AUTH_MODE: ${{ secrets.DERIV_AUTH_MODE || 'pat' }}
      DERIV_LIFECYCLE_MODE: VERIFY_ONLY
      DERIV_VERIFY_STAKE: "1.0"
      DERIV_VERIFY_PROBABILITY: "0.60"
      DERIV_VERIFY_DIRECTION: BUY
      DERIV_VERIFY_CONTRACT_TYPE: CALL
      DERIV_VERIFY_DURATION: "1"
      DERIV_VERIFY_DURATION_UNIT: s
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: BLOCKED

    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify protected credential presence
        shell: bash
        run: |
          token="${DERIV_AUTH_TOKEN:-${DERIV_PAT:-}}"
          test -n "$token" || { echo "DERIV_AUTH_SESSION=BLOCKED_EXTERNAL_SECRET"; exit 2; }
          test -n "${DERIV_EXPECTED_LOGINID:-${DERIV_AUTHORIZED_ACCOUNT_ID:-}}" || { echo "DERIV_ACCOUNT_BINDING=BLOCKED_EXTERNAL_SECRET"; exit 2; }
          test -n "${DERIV_EXPECTED_CURRENCY}" || { echo "DERIV_CURRENCY=BLOCKED_EXTERNAL_SECRET"; exit 2; }
          if [ "${DERIV_AUTH_MODE}" = "pat" ]; then
            test -n "${DERIV_APP_ID}" || { echo "DERIV_APP_ID=BLOCKED_EXTERNAL_SECRET"; exit 2; }
          fi
          echo "Protected Deriv configuration present; secret values are not printed."

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify authenticated Deriv session
        env:
          DERIV_EVIDENCE_OUT: artifacts/deriv_authenticated_session.json
        run: python scripts/verify_deriv_session.py

      - name: Verify broker proposal and control lifecycle without capital submission
        env:
          DERIV_LIFECYCLE_EVIDENCE_OUT: artifacts/deriv_transaction_lifecycle.json
        run: python scripts/verify_deriv_transaction_lifecycle.py

      - name: Assert capital remains blocked
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          test -f artifacts/deriv_authenticated_session.json
          test -f artifacts/deriv_transaction_lifecycle.json
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "CAPITAL_MOVEMENT=false"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
          echo "LIVE_EXECUTION=BLOCKED"

      - name: Upload Deriv verify-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-verify-only-lifecycle-evidence
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14
