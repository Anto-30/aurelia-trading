name: Deriv New API Contract Regression

on:
  pull_request:
    paths:
      - "runtime/adapters/deriv_adapter.py"
      - "tests/test_deriv_adapter_contract.py"
      - ".github/workflows/deriv-new-api-contract-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deriv-new-api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run New API adapter contract tests
        run: python -m unittest discover -s tests -p "test_deriv_adapter_contract.py" -v
