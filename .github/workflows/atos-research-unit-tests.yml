name: AURELIA Research Unit Tests

on:
  push:
    branches:
      - fix/deriv-granularity-enum-20261023
      - fix/reject-out-of-range-deriv-history-20261025
  pull_request:
    branches:
      - research/msnr-baseline-r100-20261022
      - fix/deriv-granularity-enum-20261023
    paths:
      - "research/msnr_baseline/**"
      - ".github/workflows/atos-research-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: aurelia-research-unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      LIVE_EXECUTION: "BLOCKED"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      AURELIA_VERIFY_ONLY: "true"
      AURELIA_ALLOW_LIVE_ORDERS: "false"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/msnr_baseline/requirements-ci.lock

      - name: Install hash-pinned research-only dependencies
        run: python -m pip install --require-hashes -r research/msnr_baseline/requirements-ci.lock

      - name: Run complete isolated research test suite
        run: python -m pytest -q research/msnr_baseline/tests
