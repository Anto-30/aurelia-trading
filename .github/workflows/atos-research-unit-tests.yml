name: AURELIA Research Unit Tests

on:
  push:
    branches:
      - fix/deriv-granularity-enum-20261023
  pull_request:
    branches:
      - research/msnr-baseline-r100-20261022
    paths:
      - "research/msnr_baseline/**"
      - ".github/workflows/atos-research-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: aurelia-research-unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      LIVE_EXECUTION: "BLOCKED"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      AURELIA_VERIFY_ONLY: "true"
      AURELIA_ALLOW_LIVE_ORDERS: "false"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/msnr_baseline/requirements.txt

      - name: Install research-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/msnr_baseline/requirements.txt pytest

      - name: Run complete isolated research test suite
        run: python -m pytest -q research/msnr_baseline/tests
