name: AURELIA Assurance
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read

concurrency:
  group: aurelia-assurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assurance:
    runs-on: ubuntu-latest
    env:
      AURELIA_AGENT_PERFORMANCE_PATH: /tmp/aurelia/agent-performance.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime and tests
        run: python -m compileall -q runtime research tests assurance
      - name: Run static production acceptance audit
        run: python scripts/production_acceptance_audit.py
      - name: Validate deployment and secret-provisioning script syntax
        run: |
          bash -n scripts/deploy/bootstrap_and_deploy.sh
          bash -n scripts/provision_deriv_github_secrets.sh
      - name: Run research-plane tests
        run: python -m unittest discover -s research/labs/tests -p 'test_*.py' -v
      - name: Run focused non-production soak evidence contract tests
        run: python -m unittest assurance.test_nonproduction_soak_evidence -v
      - name: Run assurance tests
        run: python -m unittest discover -s assurance -p 'test_*.py' -v
      - name: Run runtime tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run secret presence report tests
        run: python -m pytest -q tests/test_secret_presence_report.py
      - name: Run hardening tests
        run: python -m unittest assurance.test_hardening_controls -v
      - name: Build clean runtime container
        run: docker build --pull -t aurelia-runtime:ci .
      - name: Verify public Deriv market-data WebSocket
        env:
          DERIV_PUBLIC_TRANSPORT_EVIDENCE_OUT: artifacts/deriv_public_transport.json
        run: python scripts/verify_deriv_public_transport.py

      - name: Upload public Deriv transport evidence
        if: always() && hashFiles('artifacts/deriv_public_transport.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: deriv-public-transport-evidence
          path: artifacts/deriv_public_transport.json
          if-no-files-found: error
      - name: Generate current readiness report
        if: always()
        env:
          AURELIA_READINESS_OUT: artifacts/AURELIA_READINESS.current.json
        run: |
          set +e
          python -m runtime.ops.readiness_orchestrator
          status=$?
          set -e
          test "$status" -eq 2
          echo "READINESS_EXPECTED_BLOCKED=true"

      - name: Upload current readiness report
        if: always() && hashFiles('artifacts/AURELIA_READINESS.current.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: aurelia-readiness-${{ github.run_id }}
          path: artifacts/AURELIA_READINESS.current.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean worker health endpoint
        env:
          PYTHONPATH: "."
          AURELIA_NON_PRODUCTION_SOAK: "true"
          FINAL_EXECUTION_AUTHORIZATION: "false"
          LIVE_EXECUTION: "BLOCKED"
          AURELIA_VERIFY_DERIV_PUBLIC: "false"
          AURELIA_VERIFY_DERIV_AUTH: "false"
          AURELIA_CONTINUOUS_RUNTIME: "false"
          AURELIA_RUN_ONCE: "false"
        run: |
          python -m runtime.main >/tmp/aurelia-worker.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/health
      - name: Run repository certification gate
        id: certification
        continue-on-error: true
        run: python -m assurance.certification_gate --json-out artifacts/certification-report.json
      - name: Upload versioned certification report
        if: always() && hashFiles('artifacts/certification-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: aurelia-certification-report-v1
          path: artifacts/certification-report.json
          if-no-files-found: error

      - name: Preserve fail-closed certification semantics
        if: always()
        run: |
          if [ "${{ steps.certification.outcome }}" = "failure" ]; then
            echo "Certification remains NOT_READY/blocked until genuine evidence exists."
            echo "LIVE_EXECUTION remains BLOCKED and FINAL_EXECUTION_AUTHORIZATION remains FALSE."
          fi

      - name: Verify live release gate remains fail-closed
        if: always()
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
          echo "$output" | grep -q "REASON="

  # Production-scoped credentials are isolated from normal PR/code validation.
  # This job only runs from trusted pushes to main and performs read-only/VERIFY_ONLY checks.
  deriv-verify-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DERIV_AUTH_CONFIGURED: ${{ (secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT) != '' && (secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID) != '' && (secrets.DERIV_EXPECTED_CURRENCY || '') == 'USD' && ((vars.DERIV_AUTH_MODE || 'pat') == 'pat' || (vars.DERIV_AUTH_MODE || 'pat') == 'oauth') && ((vars.DERIV_AUTH_MODE || 'pat') != 'pat' || (secrets.DERIV_APP_ID || '') != '') }}
      DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify protected Deriv authentication prerequisites
        if: always()
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
        run: python scripts/deriv_auth_prerequisites.py
      
      - name: Upload Deriv authentication prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deriv-auth-prerequisites
          path: artifacts/deriv_auth_prerequisites.json
          if-no-files-found: warn
      
      - name: Verify authenticated Deriv real-account session
        if: env.DERIV_AUTH_CONFIGURED == 'true'
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: "real"
          DERIV_EVIDENCE_OUT: artifacts/deriv_authenticated_session.json
        run: |
          python scripts/verify_deriv_session.py
      
      - name: Verify authenticated Deriv broker account evidence (read-only)
        if: env.DERIV_AUTH_CONFIGURED == 'true'
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: "real"
          DERIV_BROKER_EVIDENCE_OUT: artifacts/deriv_broker_account_evidence.json
        run: python scripts/verify_deriv_broker_evidence.py
      
      - name: Verify authenticated Deriv verify-only transaction lifecycle
        if: env.DERIV_AUTH_CONFIGURED == 'true'
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: "real"
          DERIV_LIFECYCLE_MODE: "VERIFY_ONLY"
          DERIV_LIFECYCLE_EVIDENCE_OUT: artifacts/deriv_transaction_lifecycle.json
          DERIV_VERIFY_STAKE: "1.0"
          DERIV_VERIFY_PROBABILITY: "0.60"
        run: |
          python scripts/verify_deriv_transaction_lifecycle.py
      
      - name: Upload authenticated broker account evidence
        if: always() && hashFiles('artifacts/deriv_broker_account_evidence.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: deriv-broker-account-read-only
          path: artifacts/deriv_broker_account_evidence.json
          if-no-files-found: error
      
      - name: Upload authenticated verify-only lifecycle evidence
        if: always() && hashFiles('artifacts/deriv_transaction_lifecycle.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: deriv-transaction-lifecycle-verify-only
          path: artifacts/deriv_transaction_lifecycle.json
          if-no-files-found: error
      
      - name: Report authenticated Deriv prerequisite state
        if: env.DERIV_AUTH_CONFIGURED != 'true'
        run: |
          echo "DERIV_AUTH_SESSION=NOT_CONFIGURED"
          echo "Configure DERIV_AUTH_TOKEN (or DERIV_PAT) and DERIV_EXPECTED_LOGINID (or DERIV_AUTHORIZED_ACCOUNT_ID) as GitHub Actions secrets to run real-account session evidence."
      
      - name: Upload authenticated Deriv evidence
        if: always() && hashFiles('artifacts/deriv_authenticated_session.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: deriv-authenticated-session
          path: artifacts/deriv_authenticated_session.json
          if-no-files-found: error
