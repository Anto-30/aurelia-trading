name: AURELIA Assurance

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  assurance-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run assurance contract tests
        run: python -m unittest discover -s assurance -p 'test_*.py' -v
      - name: Run hardening assurance contracts
        run: python -m unittest assurance.test_hardening_controls -v
      - name: Run repository certification gate
        id: certification
        continue-on-error: true
        run: python -m assurance.certification_gate
      - name: Preserve fail-closed certification semantics
        run: |
          if [ "${{ steps.certification.outcome }}" = "failure" ]; then
            echo "Certification is NOT_READY or otherwise blocked."
            echo "This does not fail the assurance test job; the certification gate itself remains fail-closed."
            echo "Live execution remains blocked until the genuine runtime and evidence gates pass."
          fi
