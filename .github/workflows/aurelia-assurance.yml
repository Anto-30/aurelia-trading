name: AURELIA Assurance
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read

concurrency:
  group: aurelia-assurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assurance:
    runs-on: ubuntu-latest
    env:
      AURELIA_AGENT_PERFORMANCE_PATH: /tmp/aurelia/agent-performance.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime and tests
        run: python -m compileall -q runtime research tests assurance
      - name: Run static production acceptance audit
        run: python scripts/production_acceptance_audit.py
      - name: Validate deployment and secret-provisioning script syntax
        run: |
          bash -n scripts/deploy/bootstrap_and_deploy.sh
          bash -n scripts/provision_deriv_github_secrets.sh
      - name: Run research-plane tests
        run: python -m unittest discover -s research/labs/tests -p 'test_*.py' -v
      - name: Smoke-test public R100 M1 and M15 historical candles
        id: historical_public_smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/369-msnr-wfo-20261108'
        continue-on-error: true
        run: |
          python -m research.labs.deriv_historical_candle_collector \
            --symbol R_100 \
            --start-epoch 1666310400 \
            --end-epoch 1666314000 \
            --timeframes 60,900 \
            --output-dir artifacts/r100-historical-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/r100-historical-smoke/manifest.json").read_text())
          assert data["authentication_used"] is False
          assert data["capital_authority"] is False
          assert data["order_submission_permitted"] is False
          assert [(row["timeframe"], row["bar_count"]) for row in data["datasets"]] == [("M1", 60), ("M15", 4)]
          print("R100_HISTORICAL_PUBLIC_SMOKE=PASS")
          PY
      - name: Upload public R100 historical smoke evidence
        if: always() && hashFiles('artifacts/r100-historical-smoke/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-r100-historical-smoke-${{ github.run_id }}
          path: artifacts/r100-historical-smoke/
          if-no-files-found: error
          retention-days: 30
      - name: Compare legacy public R100 historical M1 and M15 candles
        id: historical_legacy_smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/369-msnr-wfo-20261108'
        continue-on-error: true
        run: |
          python -m research.labs.deriv_historical_candle_collector \
            --symbol R_100 \
            --start-epoch 1666310400 \
            --end-epoch 1666314000 \
            --timeframes 60,900 \
            --api-variant legacy \
            --output-dir artifacts/r100-historical-legacy-smoke
      - name: Upload legacy public R100 historical evidence
        if: always() && hashFiles('artifacts/r100-historical-legacy-smoke/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-r100-legacy-history-smoke-${{ github.run_id }}
          path: artifacts/r100-historical-legacy-smoke/
          if-no-files-found: error
          retention-days: 30
      - name: Run assurance tests
        run: python -m unittest discover -s assurance -p 'test_*.py' -v
      - name: Run runtime tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run secret presence report tests
        run: python -m pytest -q tests/test_secret_presence_report.py
      - name: Run hardening tests
        run: python -m unittest assurance.test_hardening_controls -v
      - name: Build clean runtime container
        run: docker build --pull -t aurelia-runtime:ci .
      - name: Verify public Deriv market-data WebSocket
        env:
          DERIV_PUBLIC_TRANSPORT_EVIDENCE_OUT: artifacts/deriv_public_transport.json
        run: python scripts/verify_deriv_public_transport.py

      - name: Upload public Deriv transport evidence
        if: always() && hashFiles('artifacts/deriv_public_transport.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deriv-public-transport-evidence
          path: artifacts/deriv_public_transport.json
          if-no-files-found: error
      - name: Generate current readiness report
        if: always()
        env:
          AURELIA_READINESS_OUT: artifacts/AURELIA_READINESS.current.json
        run: |
          set +e
          python -m runtime.ops.readiness_orchestrator
          status=$?
          set -e
          test "$status" -eq 2
          echo "READINESS_EXPECTED_BLOCKED=true"

      - name: Verify clean worker health endpoint
        env:
          PYTHONPATH: "."
          AURELIA_NON_PRODUCTION_SOAK: "true"
          FINAL_EXECUTION_AUTHORIZATION: "false"
          LIVE_EXECUTION: "BLOCKED"
          AURELIA_VERIFY_DERIV_PUBLIC: "false"
          AURELIA_VERIFY_DERIV_AUTH: "false"
          AURELIA_CONTINUOUS_RUNTIME: "false"
          AURELIA_RUN_ONCE: "false"
        run: |
          python -m runtime.main >/tmp/aurelia-worker.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/health
      - name: Run repository certification gate
        id: certification
        continue-on-error: true
        run: python -m assurance.certification_gate
      - name: Preserve fail-closed certification semantics
        if: always()
        run: |
          if [ "${{ steps.certification.outcome }}" = "failure" ]; then
            echo "Certification remains NOT_READY/blocked until genuine evidence exists."
            echo "LIVE_EXECUTION remains BLOCKED and FINAL_EXECUTION_AUTHORIZATION remains FALSE."
          fi

      - name: Verify live release gate remains fail-closed
        if: always()
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
          echo "$output" | grep -q "REASON="

      - name: Enforce historical dataset smoke result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/research/369-msnr-wfo-20261108'
        env:
          PUBLIC_SMOKE_OUTCOME: ${{ steps.historical_public_smoke.outcome }}
        run: |
          if [ "$PUBLIC_SMOKE_OUTCOME" != "success" ]; then
            echo "R100_HISTORICAL_DATASET_GATE=BLOCKED"
            echo "The exact historical M1/M15 source window was not verified; a green unit-test suite is not historical-data evidence."
            exit 1
          fi
          echo "R100_HISTORICAL_DATASET_GATE=PASS"
