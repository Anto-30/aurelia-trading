name: AURELIA Protected Deriv Read-Only Verification
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm this workflow performs authenticated read-only account checks only; no orders or payments."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aurelia-protected-deriv-verification
  cancel-in-progress: false

jobs:
  verify-read-only:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DERIV_ENVIRONMENT: real
      AURELIA_DEPLOYMENT_MODE: VERIFY_ONLY
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - name: Reject unexpected trigger context
        env:
          REF: ${{ github.ref }}
          CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
        run: |
          test "$REF" = "refs/heads/main"
          test "$CONFIRM_READ_ONLY" = "true"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved by GitHub Actions run 40209026944
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert canonical safety lock integrity
        env:
          EXPECTED_LIVE_LOCK_BLOB_SHA: b2cddd1efb0f25f35a6a08354290f805812bf34c
        run: |
          set -euo pipefail
          actual="$(git rev-parse "HEAD:config/LIVE_LOCK.yaml")"
          echo "LIVE_LOCK_BLOB_SHA=$actual"
          test "$actual" = "$EXPECTED_LIVE_LOCK_BLOB_SHA"
          grep -Fxq 'live_trading_enabled: false' config/LIVE_LOCK.yaml
          grep -Fxq 'FINAL_EXECUTION_AUTHORIZATION: false' config/LIVE_LOCK.yaml
          grep -Fxq 'LIVE_EXECUTION: BLOCKED' config/LIVE_LOCK.yaml
          grep -Fxq 'capital_plane_mode: VERIFY_ONLY' config/LIVE_LOCK.yaml
          grep -Fxq 'research_capital_authority: false' config/LIVE_LOCK.yaml
          grep -Fxq 'external_repositories_capital_forbidden: true' config/LIVE_LOCK.yaml
          echo "CANONICAL_LIVE_LOCK=PASS"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, resolved by GitHub Actions run 40209026944
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify authenticated account binding and balance (read-only)
        env:
          AURELIA_VERIFY_DERIV_AUTH: "true"
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: real
          DERIV_EVIDENCE_OUT: artifacts/deriv_authenticated_session.json
        run: python scripts/run_redacted_deriv_verifier.py python scripts/verify_deriv_session.py
      - name: Verify broker account statement and portfolio (read-only)
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_ENVIRONMENT: real
          DERIV_BROKER_EVIDENCE_OUT: artifacts/deriv_broker_account_evidence.json
        run: python scripts/run_redacted_deriv_verifier.py python scripts/verify_deriv_broker_evidence.py
      - name: Create privacy-minimised read-only attestation
        if: always()
        run: |
          python scripts/sanitize_deriv_readonly_evidence.py \
            --session artifacts/deriv_authenticated_session.json \
            --broker artifacts/deriv_broker_account_evidence.json \
            --output artifacts/deriv_read_only_attestation.json
      - name: Upload privacy-minimised read-only attestation
        if: always() && hashFiles('artifacts/deriv_read_only_attestation.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved by GitHub Actions run 40209026944
        with:
          name: deriv-read-only-attestation
          path: artifacts/deriv_read_only_attestation.json
          if-no-files-found: error
          retention-days: 3
