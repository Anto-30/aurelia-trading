name: AURELIA Pull Request Validation

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "docs/research/**"

permissions:
  contents: read

concurrency:
  group: aurelia-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Non-production validation (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile runtime, research, tests, and assurance
        run: python -m compileall -q runtime research tests assurance
      - name: Static production acceptance audit
        run: python scripts/production_acceptance_audit.py
      - name: Validate deployment script syntax
        run: |
          bash -n scripts/deploy/bootstrap_and_deploy.sh
          bash -n scripts/provision_deriv_github_secrets.sh
      - name: Research-plane tests
        run: python -m unittest discover -s research/labs/tests -p 'test_*.py' -v
      - name: Assurance tests
        run: python -m unittest discover -s assurance -p 'test_*.py' -v
      - name: Runtime tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Secret-presence report tests
        run: python -m pytest -q tests/test_secret_presence_report.py
      - name: Hardening tests
        run: python -m unittest assurance.test_hardening_controls -v
      - name: Assert live release gate remains blocked
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
          echo "$output" | grep -q "REASON="
