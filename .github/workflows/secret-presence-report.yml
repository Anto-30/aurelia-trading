name: AURELIA Production Credential Presence Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-production-credential-presence
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Report production secret and variable presence (values never printed)
        env:
          # Trade-scoped bearer token must always be a GitHub Environment secret.
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_PAT: ""
          # Non-secret application/account configuration may be protected variables.
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID || vars.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID || vars.DERIV_EXPECTED_LOGINID || vars.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTHORIZED_ACCOUNT_ID: ""
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || vars.DERIV_EXPECTED_CURRENCY }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_ENVIRONMENT: ${{ vars.DERIV_ENVIRONMENT || 'real' }}
          AURELIA_HOST: ${{ secrets.AURELIA_HOST }}
          AURELIA_USER: ${{ secrets.AURELIA_USER }}
          AURELIA_SSH_KEY: ${{ secrets.AURELIA_SSH_KEY }}
          AURELIA_KNOWN_HOSTS: ${{ secrets.AURELIA_KNOWN_HOSTS }}
          AURELIA_ATTESTATION_SIGNING_KEY: ${{ secrets.AURELIA_ATTESTATION_SIGNING_KEY }}
          AURELIA_OPERATOR_RESET_SIGNING_KEY: ${{ secrets.AURELIA_OPERATOR_RESET_SIGNING_KEY }}
          AURELIA_RUNTIME_ID: ${{ vars.AURELIA_RUNTIME_ID || 'aurelia-production-worker' }}
          FINAL_EXECUTION_AUTHORIZATION: "false"
          LIVE_EXECUTION: "BLOCKED"
        run: python scripts/report_secret_presence.py

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run reporter tests without production credentials
        run: python -m pytest -q tests/test_secret_presence_report.py

      - name: Assert capital protection
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
