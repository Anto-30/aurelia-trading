name: AURELIA Secret Presence Report

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    # Load production-scoped Actions secrets without creating a deployment record.
    environment: production
    runs-on: ubuntu-latest
    env:
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}
      DERIV_AUTH_MODE: ${{ secrets.DERIV_AUTH_MODE || 'pat' }}
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run secret presence report
        run: python scripts/report_secret_presence.py

      - name: Install secret-report test dependency
        run: python -m pip install pytest

      - name: Run reporter tests
        run: python -m pytest -q tests/test_secret_presence_report.py

      - name: Assert capital protection
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
