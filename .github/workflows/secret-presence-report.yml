name: AURELIA Secret Presence Report

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      AURELIA_RUNTIME_ID: ${{ vars.AURELIA_RUNTIME_ID || 'aurelia-production-worker' }}
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved by GitHub Actions run 40209026944
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, resolved by GitHub Actions run 40209026944
        with:
          python-version: "3.13"

      - name: Run secret presence report
        env:
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          AURELIA_HOST: ${{ secrets.AURELIA_HOST }}
          AURELIA_USER: ${{ secrets.AURELIA_USER }}
          AURELIA_SSH_KEY: ${{ secrets.AURELIA_SSH_KEY }}
          AURELIA_KNOWN_HOSTS: ${{ secrets.AURELIA_KNOWN_HOSTS }}
          AURELIA_ATTESTATION_SIGNING_KEY: ${{ secrets.AURELIA_ATTESTATION_SIGNING_KEY }}
          AURELIA_OPERATOR_RESET_SIGNING_KEY: ${{ secrets.AURELIA_OPERATOR_RESET_SIGNING_KEY }}
        run: python scripts/report_secret_presence.py

      - name: Install secret-report test dependency
        run: python -m pip install pytest

      - name: Run reporter tests
        run: python -m pytest -q tests/test_secret_presence_report.py

      - name: Assert capital protection
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
