name: AURELIA Non-Secret Prerequisite Status Report

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      ACCOUNT_DERIV_AUTH_MODE: "oauth"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Report only policy-known and explicitly uninspected states
        run: python scripts/report_secret_presence.py

      - name: Install report-test dependency
        run: python -m pip install pytest

      - name: Run non-secret reporter tests
        run: python -m pytest -q tests/test_secret_presence_report.py

      - name: Assert capital protection
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
