name: AURELIA Production Credential Presence Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-production-credential-presence
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Report boolean-only production secret presence
        env:
          DERIV_AUTH_TOKEN_PRESENT: ${{ secrets.DERIV_AUTH_TOKEN != '' || secrets.DERIV_PAT != '' }}
          DERIV_APP_ID_PRESENT: ${{ secrets.DERIV_APP_ID != '' || vars.DERIV_APP_ID != '' }}
          DERIV_EXPECTED_LOGINID_PRESENT: ${{ secrets.DERIV_EXPECTED_LOGINID != '' || secrets.DERIV_AUTHORIZED_ACCOUNT_ID != '' || vars.DERIV_EXPECTED_LOGINID != '' || vars.DERIV_AUTHORIZED_ACCOUNT_ID != '' }}
          DERIV_EXPECTED_CURRENCY_PRESENT: ${{ secrets.DERIV_EXPECTED_CURRENCY != '' || vars.DERIV_EXPECTED_CURRENCY != '' }}
          DERIV_EXPECTED_CURRENCY_SUPPORTED: ${{ secrets.DERIV_EXPECTED_CURRENCY == 'USD' || vars.DERIV_EXPECTED_CURRENCY == 'USD' }}
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_ENVIRONMENT: ${{ vars.DERIV_ENVIRONMENT || 'real' }}
          AURELIA_HOST_PRESENT: ${{ secrets.AURELIA_HOST != '' }}
          AURELIA_USER_PRESENT: ${{ secrets.AURELIA_USER != '' }}
          AURELIA_SSH_KEY_PRESENT: ${{ secrets.AURELIA_SSH_KEY != '' }}
          AURELIA_KNOWN_HOSTS_PRESENT: ${{ secrets.AURELIA_KNOWN_HOSTS != '' }}
          AURELIA_ATTESTATION_SIGNING_KEY_PRESENT: ${{ secrets.AURELIA_ATTESTATION_SIGNING_KEY != '' }}
          AURELIA_OPERATOR_RESET_SIGNING_KEY_PRESENT: ${{ secrets.AURELIA_OPERATOR_RESET_SIGNING_KEY != '' }}
          AURELIA_RUNTIME_ID: ${{ vars.AURELIA_RUNTIME_ID || 'aurelia-production-worker' }}
          FINAL_EXECUTION_AUTHORIZATION: "false"
          LIVE_EXECUTION: "BLOCKED"
        run: python scripts/report_secret_presence.py

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run reporter tests without production credentials
        run: python -m pytest -q tests/test_secret_presence_report.py

      - name: Assert capital protection
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
