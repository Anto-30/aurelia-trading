name: AURELIA Deriv Credential Boundary Audit

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Audit every workflow for Deriv account-secret injection
        run: python scripts/audit_deriv_workflow_credentials.py
      - name: Run credential-boundary regression tests
        run: python -m unittest discover -s tests -p "test_deriv_workflow_credential_audit.py" -v
