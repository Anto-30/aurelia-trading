name: AURELIA Ruff Static Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff changed Python files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned development linter
        run: python -m pip install --disable-pip-version-check --no-deps "ruff==0.17.4"

      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "null" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}" "${HEAD_SHA}" -- '*.py'
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files; Ruff check is not applicable to this change."
            exit 0
          fi
          python -m ruff check --output-format=github "${python_files[@]}"
