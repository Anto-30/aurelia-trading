name: AURELIA Assurance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    env:
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run assurance suite
        run: python -m unittest discover -s assurance -p 'test_*.py' -v

      - name: Run runtime tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and smoke-test container
        run: |
          docker build --tag aurelia-assurance-smoke .
          docker run --detach --rm --name aurelia-assurance-smoke --publish 18080:8080 aurelia-assurance-smoke
          cleanup() { docker stop aurelia-assurance-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/tmp/aurelia-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/aurelia-health.json").read_text())
          assert payload["liveness"] is True, payload
          assert payload["capital_can_open_new_exposure"] is False, payload
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Assert capital protection
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
