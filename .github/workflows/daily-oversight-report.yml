name: AURELIA Daily Oversight Report

on:
  schedule:
    # 08:00 Africa/Nairobi (UTC+3). GitHub scheduled runs execute from the default branch.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: aurelia-daily-oversight
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate report script
        run: bash -n scripts/daily_oversight_report.sh
      - name: Generate daily oversight report
        run: bash scripts/daily_oversight_report.sh "daily_oversight_$(date -u +%Y%m%d).md"
      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-daily-oversight-${{ github.run_id }}
          path: daily_oversight_*.md
          if-no-files-found: error
          retention-days: 30
