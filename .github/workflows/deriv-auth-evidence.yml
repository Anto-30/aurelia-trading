name: AURELIA Deriv Account Evidence (Blocked — No Read-Only Scope)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: aurelia-deriv-account-identity
  cancel-in-progress: false

jobs:
  blocked:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report unavailable read-only account scope
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIV_ACCOUNT_EVIDENCE=BLOCKED"
          echo "DERIV_ACCOUNT_EVIDENCE_REASON=DERIV_READ_ONLY_ACCOUNT_SCOPE_UNAVAILABLE"
          echo "DERIV_ACCOUNT_ENDPOINTS_REQUIRE_TRADE_SCOPE=true"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "CAPITAL_AUTHORITY_GRANTED=false"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
