name: AURELIA Deriv Public Research and Account Scope Status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-deriv-public-scope
  cancel-in-progress: true

jobs:
  verify-public-and-account-scope:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_DERIV_AUTH_MODE: "none"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
      DERIV_PUBLIC_TRANSPORT_EVIDENCE_OUT: artifacts/deriv_public_transport.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify unauthenticated R_100 M1 historical data
        run: python scripts/verify_deriv_public_transport.py
      - name: Record account scope as blocked
        run: python scripts/deriv_auth_prerequisites.py
      - name: Assert account evidence and capital remain blocked
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          grep -q '"read_only_scope_supported": false' artifacts/deriv_auth_prerequisites.json
          grep -q '"account_evidence_ready": false' artifacts/deriv_auth_prerequisites.json
      - name: Upload public market-data and scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-deriv-public-and-scope-status
          path: |
            artifacts/deriv_public_transport.json
            artifacts/deriv_auth_prerequisites.json
          if-no-files-found: ignore
          retention-days: 14
