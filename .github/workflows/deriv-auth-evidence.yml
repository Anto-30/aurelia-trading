name: AURELIA Deriv Account Identity Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-deriv-account-identity
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      DERIV_ENVIRONMENT: real
      LIVE_EXECUTION: BLOCKED
      FINAL_EXECUTION_AUTHORIZATION: "false"
      AURELIA_AUTONOMOUS_LOOP: "false"
      AURELIA_DEPLOYMENT_MODE: VERIFY_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify exact account identity and fresh balance (no orders)
        id: account_verify
        env:
          # Deriv documents OAuth trade scope for account discovery and OTP.
          # The token is confined to this trusted, manual-main verifier process.
          DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
          DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
          DERIV_PAT: ""
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
          DERIV_AUTHORIZED_ACCOUNT_ID: ""
          DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/verify_deriv_session.py
      - name: Assert no execution authority
        if: always()
        run: |
          test "$LIVE_EXECUTION" = "BLOCKED"
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$AURELIA_AUTONOMOUS_LOOP" = "false"
          echo "VERIFIER_ACTIONS=ACCOUNT_LIST_OTP_BALANCE_ONLY"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "CAPITAL_AUTHORITY_GRANTED=false"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
