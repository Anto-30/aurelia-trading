name: AURELIA Deriv Account Evidence Status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-deriv-account-evidence-status
  cancel-in-progress: true

jobs:
  account-evidence-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNT_DERIV_AUTH_MODE: "oauth"
      DERIV_AUTH_TOKEN: ""
      DERIV_PAT: ""
      DERIV_OAUTH_ACCESS_TOKEN: ""
      DERIV_OAUTH_REFRESH_TOKEN: ""
      DERIV_REFRESH_TOKEN: ""
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7
      - name: Record public-research and account-evidence prerequisite state
        run: python scripts/deriv_auth_prerequisites.py
      - name: Assert the account plane remains blocked without a read-only scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/deriv_auth_prerequisites.json").read_text())
          assert evidence["public_research"]["auth_mode"] == "none"
          assert evidence["public_research"]["account_credentials_mapped"] is False
          assert evidence["account_evidence"]["status"] == "BLOCKED"
          assert evidence["account_evidence"]["read_only_scope_supported"] is False
          assert evidence["account_evidence"]["reason"] == "DERIV_READ_ONLY_ACCOUNT_SCOPE_UNAVAILABLE"
          assert evidence["account_evidence_ready"] is False
          assert evidence["secret_values_exposed"] is False
          print("DERIV_ACCOUNT_EVIDENCE=BLOCKED")
          print("DERIV_ACCOUNT_BLOCK_REASON=DERIV_READ_ONLY_ACCOUNT_SCOPE_UNAVAILABLE")
          print("LIVE_EXECUTION=BLOCKED")
          print("FINAL_EXECUTION_AUTHORIZATION=false")
          PY
      - name: Upload non-secret prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-account-evidence-status-${{ github.run_id }}
          path: artifacts/deriv_auth_prerequisites.json
          if-no-files-found: error
          retention-days: 14
