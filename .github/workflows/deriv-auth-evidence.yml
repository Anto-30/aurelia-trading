name: AURELIA Deriv Verify-Only Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-deriv-verify-only
  cancel-in-progress: true

jobs:
  verify:
    # This workflow must opt into the same protected environment as the other
    # Deriv verification workflows; environment-scoped secrets are unavailable
    # to jobs that omit this declaration.
    environment: production
    runs-on: ubuntu-latest
    env:
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN }}
      DERIV_PAT: ${{ secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_AUTHORIZED_ACCOUNT_ID: ${{ secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY }}
      DERIV_ENVIRONMENT: real
      DERIV_AUTH_MODE: ${{ vars.DERIV_AUTH_MODE || 'pat' }}
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - uses: actions/checkout@v7

      - name: Diagnose protected Deriv configuration without values
        shell: bash
        run: |
          set +x
          set -uo pipefail
          missing=0
          report_presence() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf 'CONFIG_PRESENT=%s\n' "$name"
            else
              printf 'CONFIG_MISSING=%s\n' "$name"
            fi
          }
          report_presence DERIV_AUTH_TOKEN "$DERIV_AUTH_TOKEN"
          report_presence DERIV_PAT "$DERIV_PAT"
          report_presence DERIV_APP_ID "$DERIV_APP_ID"
          report_presence DERIV_EXPECTED_LOGINID "$DERIV_EXPECTED_LOGINID"
          report_presence DERIV_AUTHORIZED_ACCOUNT_ID "$DERIV_AUTHORIZED_ACCOUNT_ID"
          report_presence DERIV_EXPECTED_CURRENCY "$DERIV_EXPECTED_CURRENCY"

          token="$DERIV_AUTH_TOKEN"
          [[ -n "$token" ]] || token="$DERIV_PAT"
          if [[ -n "$token" ]]; then
            echo "DERIV_CREDENTIAL_AVAILABLE=true"
          else
            echo "DERIV_CREDENTIAL_AVAILABLE=false"
            missing=1
          fi

          expected_loginid="$DERIV_EXPECTED_LOGINID"
          [[ -n "$expected_loginid" ]] || expected_loginid="$DERIV_AUTHORIZED_ACCOUNT_ID"
          if [[ -n "$expected_loginid" ]]; then
            echo "DERIV_EXPECTED_ACCOUNT_ID_AVAILABLE=true"
          else
            echo "DERIV_EXPECTED_ACCOUNT_ID_AVAILABLE=false"
            missing=1
          fi

          auth_mode="$(printf '%s' "${DERIV_AUTH_MODE:-pat}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$auth_mode" == "pat" || "$auth_mode" == "oauth" ]]; then
            echo "DERIV_AUTH_MODE_VALID=true"
            printf 'DERIV_AUTH_MODE_EFFECTIVE=%s\n' "$(printf '%s' "$auth_mode" | tr '[:lower:]' '[:upper:]')"
          else
            echo "DERIV_AUTH_MODE_VALID=false"
            echo "DERIV_AUTH_MODE_EFFECTIVE=INVALID"
            missing=1
          fi
          if [[ "$auth_mode" == "pat" && -z "$DERIV_APP_ID" ]]; then
            echo "DERIV_APP_ID_REQUIRED_FOR_PAT=true"
            missing=1
          else
            echo "DERIV_APP_ID_REQUIRED_FOR_PAT=false"
          fi

          currency="$(printf '%s' "$DERIV_EXPECTED_CURRENCY" | tr '[:lower:]' '[:upper:]')"
          if [[ "$currency" == "USD" ]]; then
            echo "DERIV_EXPECTED_CURRENCY_SUPPORTED=true"
          else
            echo "DERIV_EXPECTED_CURRENCY_SUPPORTED=false"
            missing=1
          fi

          if (( missing != 0 )); then
            echo "DERIV_CONFIGURATION=BLOCKED_MISSING_OR_INVALID_PREREQUISITES"
            exit 2
          fi
          echo "DERIV_CONFIGURATION=PREREQUISITES_PRESENT_VALUES_NOT_LOGGED"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run authenticated Deriv verification
        run: |
          python scripts/verify_deriv_session.py

      - name: Verify authenticated broker account evidence (read-only)
        env:
          DERIV_BROKER_EVIDENCE_OUT: artifacts/deriv_broker_account_evidence.json
        run: python scripts/verify_deriv_broker_evidence.py

      - name: Assert no capital authority
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "DERIV_ORDERS_SUBMITTED=0"

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-authenticated-session-evidence
          path: |
            artifacts/deriv_authenticated_session.json
            artifacts/deriv_broker_account_evidence.json
          if-no-files-found: ignore
          retention-days: 14
