name: AURELIA Release Closure

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aurelia-release-closure
  cancel-in-progress: false

jobs:
  closure:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
      DERIV_PAT: ${{ secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_AUTHORIZED_ACCOUNT_ID: ${{ secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}
      DERIV_AUTH_MODE: ${{ secrets.DERIV_AUTH_MODE || 'pat' }}
      DERIV_ENVIRONMENT: "real"
      AURELIA_RUNTIME_ID: ${{ secrets.AURELIA_RUNTIME_ID }}
      AURELIA_ATTESTATION_SIGNING_KEY: ${{ secrets.AURELIA_ATTESTATION_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Import latest successful R100 research evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research_state evidence /tmp/r100-artifact
          artifact_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=aurelia-r100-prospective-oos&per_page=100" |
              jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | map(select(.workflow_run.head_branch == "main")) | .[0] // empty'
          )"
          if [ -z "$artifact_json" ] || [ "$artifact_json" = "null" ]; then
            echo "R100_ARTIFACT_IMPORT=NONE_AVAILABLE"
            exit 0
          fi
          artifact_id="$(jq -r '.id' <<<"$artifact_json")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/r100-artifact/r100.zip
          unzip -oq /tmp/r100-artifact/r100.zip -d /tmp/r100-artifact/extracted
          if [ -f /tmp/r100-artifact/extracted/evidence/prospective_oos.json ]; then
            cp /tmp/r100-artifact/extracted/evidence/prospective_oos.json evidence/prospective_oos.json
          fi
          if [ -f /tmp/r100-artifact/extracted/evidence/calibration.json ]; then
            cp /tmp/r100-artifact/extracted/evidence/calibration.json evidence/calibration.json
          fi
          if [ -f /tmp/r100-artifact/extracted/aurelia_r100_state.json ]; then
            cp /tmp/r100-artifact/extracted/aurelia_r100_state.json .research_state/aurelia_r100_state.json
          fi
          if [ -f /tmp/r100-artifact/extracted/aurelia_r100_report.json ]; then
            cp /tmp/r100-artifact/extracted/aurelia_r100_report.json .research_state/aurelia_r100_report.json
          fi
          echo "R100_ARTIFACT_IMPORT=SUCCESS"
          echo "R100_ARTIFACT_ID=${artifact_id}"

          soak_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=aurelia-non-production-3600s-soak-evidence&per_page=100" |
              jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | map(select(.workflow_run.head_branch == "main")) | .[0] // empty'
          )"
          if [ -n "$soak_json" ] && [ "$soak_json" != "null" ]; then
            soak_id="$(jq -r '.id' <<<"$soak_json")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${soak_id}/zip" > /tmp/r100-artifact/soak.zip
            unzip -oq /tmp/r100-artifact/soak.zip -d /tmp/r100-artifact/soak
            if [ -f /tmp/r100-artifact/soak/evidence/soak_3600s.json ]; then
              cp /tmp/r100-artifact/soak/evidence/soak_3600s.json evidence/soak_3600s.json
            fi
            echo "SOAK_ARTIFACT_IMPORT=SUCCESS"
            echo "SOAK_ARTIFACT_ID=${soak_id}"
          else
            echo "SOAK_ARTIFACT_IMPORT=NONE_AVAILABLE"
          fi

      - name: Generate current closure report
        run: |
          set +e
          python scripts/release_closure.py > release-closure.json
          status=$?
          set -e
          cat release-closure.json
          echo "RELEASE_CLOSURE_STATUS=$status"
      - name: Upload closure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-release-closure-${{ github.run_id }}
          path: release-closure.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve fail-closed behavior
        run: |
          test -f release-closure.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("release-closure.json").read_text())
          assert data["final_execution_authorization"] in (False, True)
          if data["final_execution_authorization"]:
              assert data["live_execution"] == "ENABLED"
          else:
              assert data["live_execution"] == "BLOCKED"
          print("RELEASE_CLOSURE_SEMANTICS=PASS")
          PY
