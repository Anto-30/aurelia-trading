name: AURELIA Agent Federation Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-audit:
    runs-on: ubuntu-latest
    env:
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate federated capability boundary
        run: python scripts/validate_agent_federation.py

      - name: Verify federated capability boundary under Python optimization
        run: python -O scripts/validate_agent_federation.py

      - name: Validate task-aware tool, skill, plugin, and repository assignments
        run: python scripts/validate_agent_tool_skill_assignments.py

      - name: Assert live release remains locked
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
