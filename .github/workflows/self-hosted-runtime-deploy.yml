name: AURELIA Self-Hosted Runtime Deploy (VERIFY_ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_verify_only:
        description: Explicitly confirm deployment in VERIFY_ONLY mode; LIVE deployment is not available.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aurelia-self-hosted-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_verify_only == true
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEPLOYMENT_MODE: "VERIFY_ONLY"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"

    steps:
      - name: Checkout exact AURELIA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved by GitHub Actions run 40209026944
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source revision and immutable safety lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:config/LIVE_LOCK.yaml)" = "b2cddd1efb0f25f35a6a08354290f805812bf34c"
          grep -Fxq 'live_trading_enabled: false' config/LIVE_LOCK.yaml
          grep -Fxq 'FINAL_EXECUTION_AUTHORIZATION: false' config/LIVE_LOCK.yaml
          grep -Fxq 'LIVE_EXECUTION: BLOCKED' config/LIVE_LOCK.yaml
          grep -Fxq 'capital_plane_mode: VERIFY_ONLY' config/LIVE_LOCK.yaml
          grep -Fxq 'research_capital_authority: false' config/LIVE_LOCK.yaml
          test "$DEPLOYMENT_MODE" = "VERIFY_ONLY"
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"

      - name: Require green AURELIA Assurance for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assurance_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aurelia-assurance.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,event,databaseId)"
          export assurance_json
          python - <<'PY'
          import json
          import os
          import sys

          runs = json.loads(os.environ["assurance_json"])
          eligible = [
              run for run in runs
              if run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("event") == "push"
          ]
          if not eligible:
              print("ASSURANCE_BLOCKED=NO_COMPLETED_GREEN_PUSH_RUN_FOR_EXACT_COMMIT")
              sys.exit(2)
          print(f"ASSURANCE_GREEN_PUSH_RUNS={len(eligible)}")
          PY

      - name: Configure strict SSH transport
        env:
          AURELIA_HOST: ${{ secrets.AURELIA_HOST }}
          AURELIA_USER: ${{ secrets.AURELIA_USER }}
          AURELIA_SSH_KEY: ${{ secrets.AURELIA_SSH_KEY }}
          AURELIA_KNOWN_HOSTS: ${{ secrets.AURELIA_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AURELIA_HOST AURELIA_USER AURELIA_SSH_KEY AURELIA_KNOWN_HOSTS; do
            test -n "$(printenv "$name")" || { echo "DEPLOYMENT_BLOCKED=SSH_SECRET_MISSING:$name"; exit 2; }
          done
          case "$AURELIA_HOST$AURELIA_USER$AURELIA_SSH_KEY$AURELIA_KNOWN_HOSTS" in
            *$'\n'*|*$'\r'*) echo "DEPLOYMENT_BLOCKED=MULTILINE_SSH_CONFIGURATION"; exit 2 ;;
          esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AURELIA_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/aurelia_target"
          printf '%s\n' "$AURELIA_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aurelia_target" "$HOME/.ssh/known_hosts"
          {
            echo "Host aurelia-target"
            echo "  HostName $AURELIA_HOST"
            echo "  User $AURELIA_USER"
            echo "  Port 22"
            echo "  IdentityFile ~/.ssh/aurelia_target"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 3"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -F "$HOME/.ssh/config" aurelia-target -- true

      - name: Package exact source commit
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/aurelia-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --output="$archive" "$GITHUB_SHA"
          test -s "$archive"
          echo "AURELIA_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Transfer exact source to target
        shell: bash
        run: |
          set -euo pipefail
          scp -F "$HOME/.ssh/config" "$AURELIA_ARCHIVE" "aurelia-target:/tmp/aurelia-$GITHUB_SHA.tar.gz"
          ssh -F "$HOME/.ssh/config" aurelia-target \
            "set -euo pipefail
             rm -rf /tmp/aurelia-release-$GITHUB_SHA
             mkdir -p /tmp/aurelia-release-$GITHUB_SHA
             tar -xzf /tmp/aurelia-$GITHUB_SHA.tar.gz -C /tmp/aurelia-release-$GITHUB_SHA
             rm -f /tmp/aurelia-$GITHUB_SHA.tar.gz
             sudo rm -rf /opt/aurelia/releases/$GITHUB_SHA
             sudo mkdir -p /opt/aurelia/releases/$GITHUB_SHA
             sudo cp -a /tmp/aurelia-release-$GITHUB_SHA/. /opt/aurelia/releases/$GITHUB_SHA/
             rm -rf /tmp/aurelia-release-$GITHUB_SHA"

      - name: Install and start exact source in VERIFY_ONLY mode
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" aurelia-target \
            "sudo env AURELIA_DEPLOYMENT_MODE=VERIFY_ONLY bash /opt/aurelia/releases/$GITHUB_SHA/scripts/deploy/bootstrap_and_deploy.sh '$GITHUB_SHA'"

      - name: Verify source, runtime health, and locked capital state
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" aurelia-target \
            "set -euo pipefail
             test -f /var/lib/aurelia/DEPLOYED_SOURCE_SHA
             test \"\$(cat /var/lib/aurelia/DEPLOYED_SOURCE_SHA)\" = '$GITHUB_SHA'
             sudo docker inspect aurelia-runtime --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'AURELIA_DEPLOYMENT_MODE=VERIFY_ONLY'
             sudo docker inspect aurelia-runtime --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'AURELIA_AUTONOMOUS_LOOP=false'
             sudo docker inspect aurelia-runtime --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'FINAL_EXECUTION_AUTHORIZATION=false'
             sudo docker inspect aurelia-runtime --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'LIVE_EXECUTION=BLOCKED'
             test \"\$(sudo docker inspect aurelia-runtime --format '{{.HostConfig.RestartPolicy.Name}}')\" = 'unless-stopped'
             curl --fail --silent --show-error http://127.0.0.1:8080/health"

      - name: Write non-secret deployment summary
        shell: bash
        run: |
          {
            echo "## AURELIA self-hosted runtime"
            echo
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "DEPLOYMENT_MODE=VERIFY_ONLY"
            echo "PERSISTENT_RUNTIME=true"
            echo "TRIAL_DEPENDENCY=false"
            echo "CAPITAL_AUTHORITY=LIVE_LOCK_only"
            echo "FINAL_EXECUTION_AUTHORIZATION=false"
            echo "LIVE_EXECUTION=BLOCKED"
          } >> "$GITHUB_STEP_SUMMARY"
