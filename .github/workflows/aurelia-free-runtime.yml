name: AURELIA Free Runtime Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-free-runtime
  cancel-in-progress: true

jobs:
  runtime-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      AURELIA_VERIFY_DERIV_PUBLIC: "true"
      AURELIA_RUN_ONCE: "true"
      AURELIA_VERIFY_DERIV_AUTH: "false"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      AURELIA_AGENT_PERFORMANCE_PATH: "/tmp/aurelia/agent-performance.json"
      DERIV_ENVIRONMENT: "real"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved by GitHub Actions run 40209026944
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, resolved by GitHub Actions run 40209026944
        with:
          python-version: "3.13"
      - name: Install runtime
        run: pip install -r requirements.txt pytest
      - name: Run free public-market runtime probe
        run: python scripts/verify_deriv_public_transport.py
      - name: Run runtime tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run assurance tests
        run: python -m unittest discover -s assurance -p "test_*.py" -v
      - name: Report accepted trade count
        if: always()
        run: |
          mkdir -p /tmp/aurelia
          python scripts/report_trade_count.py --journal /tmp/aurelia/execution-events.ndjson | tee /tmp/aurelia/trade-count.json
      - name: Preserve live fail-closed gate
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
      - name: Upload non-sensitive trade-count summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved by GitHub Actions run 40209026944
        with:
          name: aurelia-runtime-trade-count-${{ github.run_id }}
          path: /tmp/aurelia/trade-count.json
          if-no-files-found: ignore
          retention-days: 7
