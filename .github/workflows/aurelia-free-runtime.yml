name: AURELIA Free Runtime Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-free-runtime
  cancel-in-progress: true

jobs:
  runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AURELIA_VERIFY_DERIV_PUBLIC: "true"
      AURELIA_RUN_ONCE: "true"
      AURELIA_VERIFY_DERIV_AUTH: "false"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      DERIV_EXPECTED_CURRENCY: "USD"
      DERIV_ENVIRONMENT: "real"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Run free public-market runtime probe
        run: python scripts/verify_deriv_public_transport.py
      - name: Run runtime tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run assurance tests
        run: python -m unittest discover -s assurance -p "test_*.py" -v
      - name: Preserve live fail-closed gate
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
      - name: Upload runtime journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-runtime-journal-${{ github.run_id }}
          path: /tmp/aurelia/
          if-no-files-found: ignore
          retention-days: 7

  authenticated-deriv-evidence:
    # Load production-scoped Actions secrets for authenticated verification only.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DERIV_AUTH_CONFIGURED: ${{ (secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT) != '' && (secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID) != '' && (secrets.DERIV_EXPECTED_CURRENCY || '') != '' && ((secrets.DERIV_AUTH_MODE || 'pat') != 'pat' || (secrets.DERIV_APP_ID || '') != '') }}
      AURELIA_VERIFY_DERIV_PUBLIC: "true"
      AURELIA_VERIFY_DERIV_AUTH: "true"
      AURELIA_RUN_ONCE: "true"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_AUTH_MODE: ${{ secrets.DERIV_AUTH_MODE || 'pat' }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}
      DERIV_ENVIRONMENT: "real"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Report authenticated prerequisite state
        if: env.DERIV_AUTH_CONFIGURED != 'true'
        run: |
          echo "DERIV_AUTH_SESSION=NOT_CONFIGURED"
          echo "Authenticated Deriv evidence is skipped because required protected secrets are not configured."
      - name: Verify authenticated Deriv session
        if: env.DERIV_AUTH_CONFIGURED == 'true'
        run: python scripts/verify_deriv_session.py
      - name: Upload authenticated evidence
        if: always() && env.DERIV_AUTH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deriv-authenticated-evidence-${{ github.run_id }}
          path: artifacts/deriv_authenticated_session.json
          if-no-files-found: ignore
          retention-days: 7

  deriv-lifecycle-verify-only:
    # Authenticated broker lifecycle verification: proposal + control-chain only.
    # This job must never submit a buy transaction or grant capital authority.
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DERIV_AUTH_CONFIGURED: ${{ (secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT) != '' && (secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID) != '' && (secrets.DERIV_EXPECTED_CURRENCY || '') != '' && ((secrets.DERIV_AUTH_MODE || 'pat') != 'pat' || (secrets.DERIV_APP_ID || '') != '') }}
      DERIV_AUTH_TOKEN: ${{ secrets.DERIV_AUTH_TOKEN || secrets.DERIV_PAT }}
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_EXPECTED_LOGINID: ${{ secrets.DERIV_EXPECTED_LOGINID || secrets.DERIV_AUTHORIZED_ACCOUNT_ID }}
      DERIV_AUTH_MODE: ${{ secrets.DERIV_AUTH_MODE || 'pat' }}
      DERIV_EXPECTED_CURRENCY: ${{ secrets.DERIV_EXPECTED_CURRENCY || 'USD' }}
      DERIV_ENVIRONMENT: "real"
      DERIV_LIFECYCLE_MODE: "VERIFY_ONLY"
      DERIV_VERIFY_STAKE: "1.0"
      DERIV_VERIFY_PROBABILITY: "0.60"
      DERIV_LIFECYCLE_EVIDENCE_OUT: artifacts/deriv_transaction_lifecycle.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Report lifecycle prerequisite state
        if: env.DERIV_AUTH_CONFIGURED != 'true'
        run: |
          echo "DERIV_TRANSACTION_LIFECYCLE=NOT_CONFIGURED"
          echo "Verify-only lifecycle evidence is skipped because required protected Deriv secrets are not configured."
      - name: Verify authenticated Deriv transaction lifecycle without submission
        if: env.DERIV_AUTH_CONFIGURED == 'true'
        run: python scripts/verify_deriv_transaction_lifecycle.py
      - name: Upload verify-only lifecycle evidence
        if: always() && env.DERIV_AUTH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deriv-transaction-lifecycle-verify-only-${{ github.run_id }}
          path: artifacts/deriv_transaction_lifecycle.json
          if-no-files-found: error
          retention-days: 7

  whatsapp-alert-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TWILIO_CONFIGURED: ${{ secrets.TWILIO_ACCOUNT_SID != '' && (secrets.TWILIO_AUTH_TOKEN != '' || (secrets.TWILIO_API_KEY != '' && secrets.TWILIO_API_SECRET != '')) && secrets.TWILIO_WHATSAPP_FROM != '' && secrets.AURELIA_WHATSAPP_TO != '' && secrets.TWILIO_CONTENT_SID != '' }}
      AURELIA_WHATSAPP_ALERTS: "true"
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      AURELIA_WHATSAPP_TO: ${{ secrets.AURELIA_WHATSAPP_TO }}
      TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
      TWILIO_HTTP_TIMEOUT_SECONDS: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Report WhatsApp prerequisite state
        if: env.TWILIO_CONFIGURED != 'true'
        run: echo "WHATSAPP_ALERTS=OPTIONAL_NOT_CONFIGURED"
      - name: Send WhatsApp smoke alert
        if: env.TWILIO_CONFIGURED == 'true'
        run: python scripts/test_whatsapp_alert.py
