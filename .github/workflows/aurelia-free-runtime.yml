name: AURELIA Free Runtime Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: aurelia-free-runtime
  cancel-in-progress: true

jobs:
  runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      AURELIA_VERIFY_DERIV_PUBLIC: "true"
      AURELIA_RUN_ONCE: "true"
      AURELIA_VERIFY_DERIV_AUTH: "false"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      AURELIA_AGENT_PERFORMANCE_PATH: "/tmp/aurelia/agent-performance.json"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime
        run: pip install -r requirements.txt pytest
      - name: Run unauthenticated public R_100 M1 market-data probe
        run: python scripts/verify_deriv_public_transport.py
      - name: Run runtime tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run assurance tests
        run: python -m unittest discover -s assurance -p "test_*.py" -v
      - name: Report accepted trade count
        if: always()
        run: |
          mkdir -p /tmp/aurelia
          python scripts/report_trade_count.py --journal /tmp/aurelia/execution-events.ndjson | tee /tmp/aurelia/trade-count.json
      - name: Preserve live fail-closed gate
        run: |
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "LIVE_RELEASE_GATE=BLOCKED"
      - name: Upload runtime journal and public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-runtime-journal-${{ github.run_id }}
          path: |
            /tmp/aurelia/
            artifacts/deriv_public_transport.json
          if-no-files-found: ignore
          retention-days: 7

  account-evidence-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT_DERIV_AUTH_MODE: "none"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Record public and account-plane prerequisite state
        run: python scripts/deriv_auth_prerequisites.py
      - name: Assert account session remains blocked without credentials
        shell: bash
        run: |
          set +e
          python scripts/verify_deriv_session.py
          status=$?
          set -e
          test "$status" -eq 3
      - name: Assert broker account evidence remains blocked without credentials
        shell: bash
        run: |
          set +e
          python scripts/verify_deriv_broker_evidence.py
          status=$?
          set -e
          test "$status" -eq 2
      - name: Assert transaction lifecycle remains blocked without credentials
        shell: bash
        run: |
          set +e
          python scripts/verify_deriv_transaction_lifecycle.py
          status=$?
          set -e
          test "$status" -eq 2
      - name: Assert no account credential values are present
        shell: bash
        run: |
          test -z "${DERIV_OAUTH_ACCESS_TOKEN:-}"
          test -z "${DERIV_OAUTH_REFRESH_TOKEN:-}"
          test -z "${DERIV_PAT:-}"
          test -z "${DERIV_AUTH_TOKEN:-}"
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
      - name: Upload non-secret account prerequisite state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-account-evidence-status-${{ github.run_id }}
          path: artifacts/deriv_auth_prerequisites.json
          if-no-files-found: ignore
          retention-days: 7

