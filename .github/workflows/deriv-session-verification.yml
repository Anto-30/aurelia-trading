name: AURELIA Deriv Account Session Verification (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report account-scope policy block
        run: |
          echo "DERIV_AUTH_SESSION=BLOCKED"
          echo "DERIV_AUTH_SESSION_REASON=DERIV_READ_ONLY_ACCOUNT_SCOPE_UNAVAILABLE"
          echo "DERIV_CREDENTIALS_READ=false"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
