name: AURELIA Deriv Account Evidence Gate (Fail Closed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-evidence-gate:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_DERIV_AUTH_MODE: "none"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify documented account scope and credential isolation
        run: python scripts/deriv_auth_prerequisites.py
      - name: Assert fail-closed account evidence status
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("artifacts/deriv_auth_prerequisites.json").read_text())
          assert evidence["account_evidence"]["status"] == "BLOCKED"
          assert evidence["account_evidence"]["read_only_scope_supported"] is False
          assert evidence["account_evidence_ready"] is False
          print("DERIV_ACCOUNT_EVIDENCE=BLOCKED_READ_ONLY_SCOPE_UNAVAILABLE")
          PY
