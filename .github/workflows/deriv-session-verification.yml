name: AURELIA Deriv Account Session Verification (Alias Guidance)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report that this alias does not execute verification
        run: |
          echo "DERIV_SESSION_VERIFICATION=NOT_EXECUTED"
          echo "NEXT_STEP=MANUALLY_DISPATCH_DERIV_AUTH_EVIDENCE_ON_MAIN"
          echo "DERIV_CREDENTIALS_READ=false"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
