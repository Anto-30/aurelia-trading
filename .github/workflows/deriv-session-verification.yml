name: AURELIA Deriv Account Session Verification (Alias)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Use the canonical account evidence workflow
        run: |
          echo "DERIV_SESSION_VERIFICATION=ROUTED_TO_DERIV_AUTH_EVIDENCE"
          echo "RUN_AURELIA_DERIV_ACCOUNT_IDENTITY_EVIDENCE_ON_MAIN=true"
          echo "DERIV_ORDERS_SUBMITTED=0"
          echo "LIVE_EXECUTION=BLOCKED"
          echo "FINAL_EXECUTION_AUTHORIZATION=false"
