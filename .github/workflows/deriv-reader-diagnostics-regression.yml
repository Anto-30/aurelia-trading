name: Deriv Reader Diagnostics Regression

on:
  pull_request:
    paths:
      - "runtime/adapters/deriv_ws.py"
      - "tests/test_deriv_ws_transport_diagnostics.py"
      - ".github/workflows/deriv-reader-diagnostics-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deriv-reader-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned transport dependency
        run: python -m pip install --disable-pip-version-check --no-input "websockets==17.1"
      - name: Run safe reader failure regression
        run: python -m unittest discover -s tests -p "test_deriv_ws_transport_diagnostics.py" -v
