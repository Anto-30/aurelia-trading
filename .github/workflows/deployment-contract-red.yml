name: AURELIA Deployment Contract Red Test

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  contract-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run deployment contract red test
        run: python -m unittest tests.test_self_hosted_deploy_contract -v
