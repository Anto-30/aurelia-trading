name: ATOS research validation
on:
  pull_request:
    paths:
      - 'research/atos_validation/**'
      - 'scripts/run_oos_validation.py'
      - 'scripts/run_soak_test.py'
      - 'scripts/build_release_evidence.py'
      - 'scripts/fetch_deriv_history.py'
      - 'config/STAGING_PAPER.yaml'
      - '.github/workflows/atos-research-validation.yml'
  push:
    branches: [main]
    paths:
      - 'research/atos_validation/**'
      - 'scripts/run_oos_validation.py'
      - 'scripts/run_soak_test.py'
      - 'config/STAGING_PAPER.yaml'
      - '.github/workflows/atos-research-validation.yml'
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/atos_validation/requirements.txt
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r research/atos_validation/requirements.txt
      - name: Compile research modules
        run: python -m compileall -q research/atos_validation scripts/run_oos_validation.py scripts/run_soak_test.py scripts/fetch_deriv_history.py scripts/build_release_evidence.py
      - name: Check operational runner CLI parsing without network access
        run: |
          python scripts/run_oos_validation.py --help >/dev/null
          python scripts/run_soak_test.py --help >/dev/null
          python scripts/fetch_deriv_history.py --help >/dev/null
          python scripts/build_release_evidence.py --help >/dev/null
      - name: Run research tests
        run: python -m unittest discover -s research/atos_validation/tests -v
      - name: Assert canonical live lock is still fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config/LIVE_LOCK.yaml').read_text()
          assert 'live_trading_enabled: false' in p
          assert 'LIVE_EXECUTION: BLOCKED' in p
          assert 'capital_plane_mode: VERIFY_ONLY' in p
          assert 'FINAL_EXECUTION_AUTHORIZATION: false' in p
          PY

  capture-corrected-deriv-history:
    # A one-off, public-market-data capture for the explicitly requested date interval.
    # No account token or order capability is used. It runs only on this research PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/atos-wfa-final-hardening-2026-10-21'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DERIV_APP_ID: "1089" # Deriv's documented testing App ID; public data only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install history client
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas websocket-client
      - name: Fetch corrected 24-month R_100 one-minute candles (UTC)
        run: |
          mkdir -p artifacts/deriv
          python scripts/fetch_deriv_history.py \
            --symbol R_100 \
            --start 2022-10-21T00:00:00Z \
            --end 2024-10-21T00:00:00Z \
            --granularity 60 \
            --bars-per-request 4500 \
            --out artifacts/deriv/R_100_1m.csv
          python scripts/verify_deriv_history_manifest.py artifacts/deriv/R_100_1m.csv
      - name: Fetch corrected 24-month R_100 fifteen-minute candles (UTC)
        run: |
          python scripts/fetch_deriv_history.py \
            --symbol R_100 \
            --start 2022-10-21T00:00:00Z \
            --end 2024-10-21T00:00:00Z \
            --granularity 900 \
            --bars-per-request 4500 \
            --out artifacts/deriv/R_100_15m.csv
          python scripts/verify_deriv_history_manifest.py artifacts/deriv/R_100_15m.csv
      - name: Upload verified CSVs and manifests
        uses: actions/upload-artifact@v4
        with:
          name: deriv-history-20221021-20241021-${{ github.sha }}
          path: |
            artifacts/deriv/R_100_1m.csv
            artifacts/deriv/R_100_1m.csv.manifest.json
            artifacts/deriv/R_100_15m.csv
            artifacts/deriv/R_100_15m.csv.manifest.json
          if-no-files-found: error
          retention-days: 90
