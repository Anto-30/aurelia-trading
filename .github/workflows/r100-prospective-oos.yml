name: AURELIA R100 Prospective OOS Research

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: aurelia-r100-prospective-oos
  cancel-in-progress: false

jobs:
  collect-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      AURELIA_R100_COLLECTION_SECONDS: "600"
      AURELIA_R100_HORIZON_TICKS: "10"
      AURELIA_R100_STATE_PATH: ".research_state/aurelia_r100_state.json"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run prospective collector tests
        run: python -m unittest research/labs/tests/test_r100_prospective_oos_collector.py -v
      - name: Recover latest prospective archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research_state/previous
          artifact_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=aurelia-r100-prospective-oos&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last.id // empty'
          )"
          if [ -z "$artifact_id" ]; then
            echo "No prior prospective archive found; starting fresh campaign."
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > .research_state/previous/archive.zip
          unzip -oq .research_state/previous/archive.zip -d .research_state/previous/extracted
          state_file="$(find .research_state/previous/extracted -name aurelia_r100_state.json -type f | head -n 1)"
          if [ -z "$state_file" ]; then
            echo "Prior archive did not contain aurelia_r100_state.json" >&2
            exit 1
          fi
          mkdir -p "$(dirname "${AURELIA_R100_STATE_PATH}")"
          cp "$state_file" "${AURELIA_R100_STATE_PATH}"
          echo "Recovered prospective archive artifact ${artifact_id}."
      - name: Select frozen campaign or stop on incompatibility
        id: select_campaign
        shell: bash
        run: |
          set -euo pipefail
          current_commit="${GITHUB_SHA}"
          if [ ! -f "${AURELIA_R100_STATE_PATH}" ]; then
            campaign_commit="${current_commit}"
            strategy_hash=""
            echo "R100_CAMPAIGN_SELECTION=FRESH"
          else
            campaign_commit="$(python -c 'import json,os; from pathlib import Path; s=json.loads(Path(os.environ["AURELIA_R100_STATE_PATH"]).read_text()); print(str(s.get("manifest",{}).get("code_commit") or ""))')"
            sealed="$(python -c 'import json,os; from pathlib import Path; s=json.loads(Path(os.environ["AURELIA_R100_STATE_PATH"]).read_text()); print(str(bool(s.get("manifest",{}).get("sealed"))).lower())')"
            if [ "$sealed" = "true" ]; then
              echo "R100_CAMPAIGN_SELECTION=SEALED_STOP"
              echo "R100_CAMPAIGN_QUALIFICATION_REQUIRES_NEW_VERSION=true"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$campaign_commit" ]; then
              echo "R100_CAMPAIGN_SELECTION=INCOMPATIBLE_STOP"
              echo "R100_CAMPAIGN_STOP_REASON=MISSING_FROZEN_SOURCE_COMMIT"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git cat-file -e "${campaign_commit}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$campaign_commit"; then
                echo "R100_CAMPAIGN_SELECTION=INCOMPATIBLE_STOP"
                echo "R100_CAMPAIGN_STOP_REASON=FROZEN_SOURCE_COMMIT_UNAVAILABLE"
                echo "stop=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            set +e
            strategy_hash="$(python scripts/verify_r100_strategy_source.py --reference-commit "$campaign_commit" 2>&1)"
            strategy_status=$?
            set -e
            if [ "$strategy_status" -ne 0 ]; then
              echo "$strategy_hash"
              echo "R100_CAMPAIGN_SELECTION=STRATEGY_SOURCE_MISMATCH"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            set +e
            validation_output="$(AURELIA_RESEARCH_CODE_COMMIT="$campaign_commit" python -c 'import os; from pathlib import Path; from research.r100_prospective_oos_collector import load_state; load_state(Path(os.environ["AURELIA_R100_STATE_PATH"])); print("R100_CAMPAIGN_STATE=VALID")' 2>&1)"
            validation_status=$?
            set -e
            echo "$validation_output"
            if [ "$validation_status" -ne 0 ]; then
              echo "R100_CAMPAIGN_SELECTION=INCOMPATIBLE_STOP"
              echo "R100_CAMPAIGN_STOP_REASON=FROZEN_CONFIG_OR_SCHEMA_MISMATCH"
              echo "stop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "R100_CAMPAIGN_SELECTION=FROZEN_STRATEGY_VERIFIED"
          fi

          if [ -z "$strategy_hash" ]; then
            strategy_hash="$(python scripts/verify_r100_strategy_source.py --reference-commit "$campaign_commit")"
          fi
          echo "R100_STRATEGY_SOURCE_COMPATIBLE=true"
          echo "R100_STRATEGY_SOURCE_HASH=$strategy_hash"
          echo "AURELIA_RESEARCH_CODE_COMMIT=$campaign_commit" >> "$GITHUB_ENV"
          echo "AURELIA_COLLECTOR_CODE_COMMIT=$current_commit" >> "$GITHUB_ENV"
          echo "AURELIA_VERIFIED_STRATEGY_SOURCE_HASH=$strategy_hash" >> "$GITHUB_ENV"
      - name: Collect real public Deriv R100 observations with bounded retry
        if: steps.select_campaign.outputs.stop != 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=1
          for attempt in 1 2; do
            echo "R100_COLLECTION_ATTEMPT=$attempt"
            set +e
            python -m research.r100_prospective_oos_collector
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "R100_COLLECTION_RETRY=1 delay_seconds=10"
              sleep 10
            fi
          done
          echo "R100_COLLECTION_EXHAUSTED=1 state_preserved_for_next_run=true"
          exit "$status"
      - name: Verify research-only semantics
        if: steps.select_campaign.outputs.stop != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(".research_state/aurelia_r100_state.json").read_text())
          report = json.loads(Path(".research_state/aurelia_r100_report.json").read_text())
          assert state["manifest"]["strategy_version"] == "0.2.0"
          assert report["execution_authorized"] is False
          assert report["capital_authority"] is False
          assert report["live_execution"] is False
          assert report["strategy_live_eligible"] is False
          assert report["execution_economics"]["status"] == "UNDETERMINED_PRODUCTION"
          assert all(0.55 <= float(row["probability"]) <= 0.75 for row in state["observations"])
          assert all(row.get("quote_status") in {"OBSERVED", "UNAVAILABLE"} for row in state["quote_observations"])
          print(
              "R100_RESEARCH_SEMANTICS=PASS",
              "observations=", report["observations_total"],
              "oos=", report["oos_observations"],
              "qualification=", report["qualification_status"],
          )
          PY
      - name: Upload prospective research archive
        if: always() && steps.select_campaign.outputs.stop != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-r100-prospective-oos
          path: |
            .research_state/aurelia_r100_state.json
            .research_state/aurelia_r100_report.json
          if-no-files-found: error
          retention-days: 30
