name: AURELIA R100 Prospective OOS Research

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: aurelia-r100-prospective-oos
  cancel-in-progress: false

jobs:
  collect-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      AURELIA_R100_COLLECTION_SECONDS: "900"
      AURELIA_R100_HORIZON_TICKS: "10"
      AURELIA_R100_STATE_PATH: ".research_state/aurelia_r100_state.json"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run prospective collector tests
        run: python -m unittest research/labs/tests/test_r100_prospective_oos_collector.py -v
      - name: Recover latest prospective archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research_state/previous
          artifact_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=aurelia-r100-prospective-oos&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last.id // empty'
          )"
          if [ -z "$artifact_id" ]; then
            echo "No prior prospective archive found; starting fresh campaign."
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > .research_state/previous/archive.zip
          unzip -oq .research_state/previous/archive.zip -d .research_state/previous/extracted
          state_file="$(find .research_state/previous/extracted -name aurelia_r100_state.json -type f | head -n 1)"
          if [ -z "$state_file" ]; then
            echo "Prior archive did not contain aurelia_r100_state.json" >&2
            exit 1
          fi
          mkdir -p "$(dirname "${AURELIA_R100_STATE_PATH}")"
          cp "$state_file" "${AURELIA_R100_STATE_PATH}"
          echo "Recovered prospective archive artifact ${artifact_id}."
      - name: Pin or safely rebind prospective campaign source
        shell: bash
        run: |
          set -euo pipefail
          campaign_sealed="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(".research_state/aurelia_r100_state.json")
          if not path.exists():
              print("false")
          else:
              state = json.loads(path.read_text(encoding="utf-8"))
              manifest = state.get("manifest", {})
              if manifest.get("sealed"):
                  print("true")
              else:
                  oos_start = datetime.fromisoformat(
                      str(manifest["oos_start_at_utc"]).replace("Z", "+00:00")
                  )
                  print("true" if datetime.now(timezone.utc) >= oos_start else "false")
          PY
          )"
          if [ "$campaign_sealed" = "true" ]; then
            rm -f ".research_state/aurelia_r100_state.json"
            echo "R100_SEALED_CAMPAIGN_ROLLOVER=NEW_CAMPAIGN"
          fi

          campaign_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path(".research_state/aurelia_r100_state.json")
          if not path.exists():
              print("")
          else:
              state = json.loads(path.read_text(encoding="utf-8"))
              print(str(state.get("manifest", {}).get("code_commit", "") or ""))
          PY
          )"

          if [ -z "$campaign_commit" ]; then
            echo "AURELIA_RESEARCH_CODE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "R100_RESEARCH_SOURCE_COMMIT=$GITHUB_SHA"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$campaign_commit"
          campaign_oos_start="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(".research_state/aurelia_r100_state.json").read_text())
          print(state["manifest"]["oos_start_at_utc"])
          PY
          )"
          now_epoch="$(date -u +%s)"
          oos_epoch="$(date -u -d "$campaign_oos_start" +%s)"

          if [ "$now_epoch" -lt "$oos_epoch" ]; then
            old_collector="$(git show "$campaign_commit:research/r100_prospective_oos_collector.py" | sha256sum | awk '{print $1}')"
            new_collector="$(git show "$GITHUB_SHA:research/r100_prospective_oos_collector.py" | sha256sum | awk '{print $1}')"
            old_signal="$(git show "$campaign_commit:runtime/strategy/autonomous_signal_engine.py" | sha256sum | awk '{print $1}')"
            new_signal="$(git show "$GITHUB_SHA:runtime/strategy/autonomous_signal_engine.py" | sha256sum | awk '{print $1}')"
            test "$old_collector" = "$new_collector"
            test "$old_signal" = "$new_signal"

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".research_state/aurelia_r100_state.json")
          state = json.loads(path.read_text())
          state["manifest"]["code_commit"] = os.environ["GITHUB_SHA"]
          state["manifest"]["provenance_migration"] = (
              "PRE_OOS_SOURCE_REBIND_STRATEGY_IMPLEMENTATION_IDENTICAL"
          )
          path.write_text(json.dumps(state, sort_keys=True, separators=(",", ":")))
          PY
            git checkout --detach "$GITHUB_SHA"
            echo "R100_PRE_OOS_SOURCE_REBIND=SAFE"
            echo "R100_STRATEGY_IMPLEMENTATION_FINGERPRINT=IDENTICAL"
          else
            git checkout --detach "$campaign_commit"
            echo "R100_OOS_SOURCE_PIN=PRESERVED"
          fi

          resolved_commit="$(git rev-parse HEAD)"
          echo "AURELIA_RESEARCH_CODE_COMMIT=$resolved_commit" >> "$GITHUB_ENV"
          echo "R100_RESEARCH_SOURCE_COMMIT=$resolved_commit"
      - name: Collect real public Deriv R100 observations
        run: python -m research.r100_prospective_oos_collector
      - name: Verify research-only semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(".research_state/aurelia_r100_state.json").read_text())
          report = json.loads(Path(".research_state/aurelia_r100_report.json").read_text())
          assert state["manifest"]["strategy_version"] == "0.2.0"
          assert report["execution_authorized"] is False
          assert report["capital_authority"] is False
          assert report["live_execution"] is False
          assert report["strategy_live_eligible"] is False
          assert report["execution_economics"]["status"] == "UNDETERMINED_PRODUCTION"
          assert all(0.55 <= float(row["probability"]) <= 0.75 for row in state["observations"])
          assert all(row.get("quote_status") in {"OBSERVED", "UNAVAILABLE"} for row in state["quote_observations"])
          print(
              "R100_RESEARCH_SEMANTICS=PASS",
              "observations=", report["observations_total"],
              "oos=", report["oos_observations"],
              "qualification=", report["qualification_status"],
          )
          PY
      - name: Promote proven R100 certification evidence
        if: always()
        run: python scripts/promote_r100_certification_evidence.py

      - name: Upload prospective research archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-r100-prospective-oos
          path: |
            .research_state/aurelia_r100_state.json
            .research_state/aurelia_r100_report.json
            evidence/prospective_oos.json
            evidence/calibration.json
          if-no-files-found: warn
          retention-days: 30
