name: AURELIA R100 Prospective OOS Research (QUARANTINED)

# Owner-delegated ATOS v2.0 decision: R_100 synthetic-index data is excluded
# from the FX/SMC programme. This workflow is intentionally non-collecting.
on:
  workflow_dispatch:

permissions: {}

jobs:
  quarantine:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record R100 quarantine status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## R_100 research quarantine"
            echo ""
            echo "R100_RESEARCH_STATUS=QUARANTINED"
            echo "FX_SMC_EVIDENCE_ELIGIBLE=false"
            echo "NEW_DATA_COLLECTION_PERMITTED=false"
            echo "DERIV_RAW_DATA_ARCHIVING_PERMITTED=false"
            echo "LEGACY_ARTIFACT_PURGE_REQUIRED=true"
            echo "LIVE_EXECUTION=BLOCKED"
            echo "FINAL_EXECUTION_AUTHORIZATION=false"
            echo ""
            echo "This workflow performs no checkout, network request, data collection, or artifact upload."
            echo "Previously created Actions artifacts require separate authorized deletion."
          } >> "$GITHUB_STEP_SUMMARY"
