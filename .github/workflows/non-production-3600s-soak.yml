name: AURELIA Non-Production 3600s Soak

# This one-hour simulation soak is explicit/manual to avoid spawning a new
# hour-long runner on every main push. Dispatch only for a reviewed main SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-non-production-soak-${{ github.sha }}
  cancel-in-progress: true

jobs:
  soak:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: "."
      AURELIA_NON_PRODUCTION_SOAK: "true"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
      AURELIA_VERIFY_DERIV_PUBLIC: "false"
      AURELIA_VERIFY_DERIV_AUTH: "false"
      AURELIA_RUN_ONCE: "false"
      SOAK_SECONDS: "3600"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify source lock remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          grep -Eq '^live_trading_enabled:[[:space:]]*false$' config/LIVE_LOCK.yaml
          grep -Eq '^FINAL_EXECUTION_AUTHORIZATION:[[:space:]]*false$' config/LIVE_LOCK.yaml
          grep -Eq '^LIVE_EXECUTION:[[:space:]]*BLOCKED$' config/LIVE_LOCK.yaml
          grep -Eq '^capital_plane_mode:[[:space:]]*VERIFY_ONLY$' config/LIVE_LOCK.yaml
          set +e
          output="$(python scripts/live_release_gate.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q 'LIVE_RELEASE_GATE=BLOCKED' <<< "$output"

      - name: Build runtime image
        run: docker build --tag aurelia-non-production-soak .

      - name: Record runtime identity
        shell: bash
        run: |
          set -euo pipefail
          config_hash="$( (sha256sum config/LIVE_LOCK.yaml .github/workflows/non-production-3600s-soak.yml) | sha256sum | awk '{print $1}')"
          echo "SOURCE_COMMIT=$GITHUB_SHA" | tee /tmp/aurelia-source-identity.env
          docker image inspect aurelia-non-production-soak --format "RUNTIME_IMAGE_ID={{.Id}}" | tee -a /tmp/aurelia-source-identity.env
          echo "CONFIG_HASH=$config_hash" | tee -a /tmp/aurelia-source-identity.env

      - name: Start isolated non-production runtime
        run: |
          docker run --detach \
            --name aurelia-non-production-soak \
            --publish 18081:8080 \
            --env PORT=8080 \
            --env AURELIA_NON_PRODUCTION_SOAK=true \
            --env AURELIA_CONTINUOUS_RUNTIME=false \
            --env AURELIA_VERIFY_DERIV_PUBLIC=false \
            --env AURELIA_VERIFY_DERIV_AUTH=false \
            --env AURELIA_RUN_ONCE=false \
            --env FINAL_EXECUTION_AUTHORIZATION=false \
            --env LIVE_EXECUTION=BLOCKED \
            aurelia-non-production-soak

          docker inspect aurelia-non-production-soak --format "RUNTIME_INSTANCE_ID={{.Id}}" | tee -a /tmp/aurelia-source-identity.env

      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -qx 'aurelia-non-production-soak'; then
              echo "RUNTIME_CONTAINER_EXITED_BEFORE_HEALTH"
              docker logs aurelia-non-production-soak 2>&1 || true
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/aurelia-startup-health.json 2>/tmp/aurelia-startup-health.err; then
              if jq -e '
                (.critical_unknowns // []) as $unknowns
                | if ($unknowns | type) != "array" then false
                  else
                    (.liveness == true) and
                    (.capital_can_open_new_exposure == false) and
                    (.state == "CAPITAL_PROTECTED" or .state == "SELF_CHECK" or .state == "BOOT") and
                    all($unknowns[]; . == "CONTINUOUS_RUNTIME_UNAVAILABLE") and
                    ((.status == "HEALTHY" and ($unknowns | length) == 0) or
                     (.status == "DEGRADED" and $unknowns == ["CONTINUOUS_RUNTIME_UNAVAILABLE"]))
                  end
              ' /tmp/aurelia-startup-health.json >/dev/null; then
                echo "RUNTIME_HEALTH_READY attempt=${attempt}"
                exit 0
              fi
            fi

            sleep 2
          done

          echo "RUNTIME_HEALTH_TIMEOUT"
          cat /tmp/aurelia-startup-health.err 2>/dev/null || true
          docker logs aurelia-non-production-soak 2>&1 || true
          exit 1

      - name: Execute 3600-second control-path soak
        shell: bash
        run: |
          set -euo pipefail

          observations="/tmp/aurelia-soak-observations.ndjson"
          mkdir -p evidence /tmp/aurelia
          rm -f evidence/soak_3600s.json aurelia-3600s-soak-evidence.json "$observations"
          : > "$observations"

          health_filter='
            (.critical_unknowns // []) as $unknowns
            | if ($unknowns | type) != "array" then false
              else
                (.liveness == true) and
                (.capital_can_open_new_exposure == false) and
                (.state == "CAPITAL_PROTECTED" or .state == "SELF_CHECK" or .state == "BOOT") and
                all($unknowns[]; . == "CONTINUOUS_RUNTIME_UNAVAILABLE") and
                ((.status == "HEALTHY" and ($unknowns | length) == 0) or
                 (.status == "DEGRADED" and $unknowns == ["CONTINUOUS_RUNTIME_UNAVAILABLE"]))
              end
          '

          start_epoch="$(date +%s)"
          start_iso="$(date -u -d "@$start_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          end_epoch=$((start_epoch + SOAK_SECONDS))
          checks=0
          restarts=0
          failures=0
          next_restart=$((start_epoch + 900))

          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            now="$(date +%s)"
            elapsed=$((now - start_epoch))
            checks=$((checks + 1))

            if ! curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/aurelia-health.json; then
              failures=$((failures + 1))
              echo "HEALTH_CHECK_FAILED elapsed=$elapsed"
              cat /tmp/aurelia-health.json 2>/dev/null || true
              docker logs aurelia-non-production-soak 2>&1 | tail -100 || true
              exit 1
            fi

            if ! jq -e "$health_filter" /tmp/aurelia-health.json >/dev/null; then
              failures=$((failures + 1))
              echo "HEALTH_INVARIANT_FAILED elapsed=$elapsed"
              cat /tmp/aurelia-health.json
              docker logs aurelia-non-production-soak 2>&1 | tail -100 || true
              exit 1
            fi

            jq -c --argjson elapsed "$elapsed" --arg sample_kind "interval" '
              {
                elapsed_seconds: $elapsed,
                sample_kind: $sample_kind,
                status: .status,
                state: .state,
                liveness: .liveness,
                capital_can_open_new_exposure: .capital_can_open_new_exposure,
                critical_unknowns: (.critical_unknowns // [])
              }
            ' /tmp/aurelia-health.json >> "$observations"

            if [ "$now" -ge "$next_restart" ] && [ "$now" -lt "$end_epoch" ]; then
              echo "CONTROLLED_RESTART elapsed=$elapsed"
              docker restart aurelia-non-production-soak >/tmp/aurelia-restart.log
              restarts=$((restarts + 1))
              recovered=false

              for attempt in $(seq 1 15); do
                if curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/aurelia-post-restart-health.json 2>/dev/null; then
                  if jq -e "$health_filter" /tmp/aurelia-post-restart-health.json >/dev/null; then
                    post_elapsed=$(( $(date +%s) - start_epoch ))
                    jq -c --argjson elapsed "$post_elapsed" --arg sample_kind "post_restart" '
                      {
                        elapsed_seconds: $elapsed,
                        sample_kind: $sample_kind,
                        status: .status,
                        state: .state,
                        liveness: .liveness,
                        capital_can_open_new_exposure: .capital_can_open_new_exposure,
                        critical_unknowns: (.critical_unknowns // [])
                      }
                    ' /tmp/aurelia-post-restart-health.json >> "$observations"
                    recovered=true
                    break
                  fi
                fi
                sleep 1
              done

              if [ "$recovered" != "true" ]; then
                echo "POST_RESTART_HEALTH_OR_INVARIANT_FAILED elapsed=$elapsed"
                cat /tmp/aurelia-post-restart-health.json 2>/dev/null || true
                docker logs aurelia-non-production-soak 2>&1 | tail -100 || true
                exit 1
              fi

              next_restart=$((next_restart + 900))
            fi

            if [ $((checks % 60)) -eq 0 ]; then
              echo "SOAK_PROGRESS elapsed=$elapsed checks=$checks restarts=$restarts"
            fi

            sleep 5
          done

          final_epoch="$(date +%s)"
          end_iso="$(date -u -d "@$final_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          duration=$((final_epoch - start_epoch))
          source_commit="$GITHUB_SHA"
          runtime_image_id="$(docker image inspect aurelia-non-production-soak --format "{{.Id}}")"
          runtime_instance_id="$(docker inspect aurelia-non-production-soak --format "{{.Id}}")"
          config_hash="$( (sha256sum config/LIVE_LOCK.yaml .github/workflows/non-production-3600s-soak.yml) | sha256sum | awk '{print $1}')"
          deployment_id="github-actions:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"

          test "$duration" -ge 3600
          test "$failures" -eq 0
          test "$restarts" -ge 3

          python -m assurance.nonproduction_soak_evidence \
            --observations "$observations" \
            --out evidence/soak_3600s.json \
            --source-commit "$source_commit" \
            --runtime-image-id "$runtime_image_id" \
            --runtime-instance-id "$runtime_instance_id" \
            --deployment-id "$deployment_id" \
            --config-hash "$config_hash" \
            --started-at "$start_iso" \
            --ended-at "$end_iso" \
            --controlled-restarts "$restarts"

          python - <<'PY'
          import json
          from pathlib import Path
          from assurance.certification_evidence import validate_evidence_file

          status, detail = validate_evidence_file(Path.cwd(), "evidence/soak_3600s.json")
          print(f"SOAK_EVIDENCE_VALIDATION={status}:{detail}")
          if status != "PASS":
              raise SystemExit(1)

          record = json.loads(Path("evidence/soak_3600s.json").read_text(encoding="utf-8"))
          summary = {
              "source_commit": record["source_commit"],
              "runtime_image_id": record["runtime_image_id"],
              "runtime_instance_id": record["runtime_instance_id"],
              "deployment_id": record["deployment_id"],
              "evidence_type": record["evidence_type"],
              "classification": record["classification"],
              "duration_seconds": record["duration_seconds"],
              "target_seconds": record["target_seconds"],
              "actual_elapsed_seconds": record["actual_elapsed_seconds"],
              "continuous": record["continuous"],
              "health_checks": record["health_checks"],
              "controlled_restarts": record["controlled_restarts"],
              "health_check_failures": record["health_check_failures"],
              "invariant_violations": record["invariant_violations"],
              "silent_degradations": record["silent_degradations"],
              "known_expected_degradation_samples": record["known_expected_degradation_samples"],
              "known_expected_unknowns": record["known_expected_unknowns"],
              "capital_authority_escapes": record["capital_authority_escapes"],
              "unresolved_unknown_states": record["unresolved_unknown_states"],
              "authenticated_deriv_session": record["authenticated_deriv_session"],
              "real_broker_transaction": record["real_broker_transaction"],
              "real_capital_movement": record["real_capital_movement"],
              "orders_submitted": record["orders_submitted"],
              "final_execution_authorization": record["final_execution_authorization"],
              "live_execution": record["live_execution"],
              "capital_can_open_new_exposure": record["capital_can_open_new_exposure"],
              "evidence_record_hash": record["record_hash"],
              "evidence_path": "evidence/soak_3600s.json"
          }
          Path("aurelia-3600s-soak-evidence.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + chr(10),
              encoding="utf-8",
          )
          print("NONPRODUCTION_SOAK_EVIDENCE=SIMULATION_VERIFIED")
          print("FINAL_EXECUTION_AUTHORIZATION=false")
          print("LIVE_EXECUTION=BLOCKED")
          PY

      - name: Assert capital protection
        if: always()
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          if docker ps --format '{{.Names}}' | grep -qx 'aurelia-non-production-soak'; then
            docker inspect aurelia-non-production-soak --format 'container_running={{.State.Running}}'
          fi

      - name: Collect runtime diagnostics
        if: always()
        run: |
          docker logs aurelia-non-production-soak > aurelia-runtime.log 2>&1 || true
          docker inspect aurelia-non-production-soak > aurelia-runtime-inspect.json 2>&1 || true
          docker rm -f aurelia-non-production-soak >/dev/null 2>&1 || true

      - name: Upload non-production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurelia-non-production-3600s-soak-evidence
          path: |
            aurelia-3600s-soak-evidence.json
            evidence/soak_3600s.json
            /tmp/aurelia-soak-observations.ndjson
            aurelia-runtime.log
            aurelia-runtime-inspect.json
            /tmp/aurelia-source-identity.env
            /tmp/aurelia-startup-health.json
            /tmp/aurelia-startup-health.err
          if-no-files-found: warn
          retention-days: 30
