name: AURELIA Non-Production 3600s Soak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-non-production-soak-${{ github.sha }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: "."
      AURELIA_NON_PRODUCTION_SOAK: "true"
      AURELIA_CONTINUOUS_RUNTIME: "false"
      FINAL_EXECUTION_AUTHORIZATION: "false"
      LIVE_EXECUTION: "BLOCKED"
      AURELIA_VERIFY_DERIV_PUBLIC: "false"
      AURELIA_VERIFY_DERIV_AUTH: "false"
      AURELIA_RUN_ONCE: "false"
      SOAK_SECONDS: "3600"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --tag aurelia-non-production-soak .

      - name: Record runtime identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=${GITHUB_SHA}" | tee /tmp/aurelia-source-identity.env
          docker image inspect aurelia-non-production-soak --format "RUNTIME_IMAGE_ID={{.Id}}" | tee -a /tmp/aurelia-source-identity.env

      - name: Start isolated non-production runtime
        run: |
          docker run --detach \
            --name aurelia-non-production-soak \
            --publish 18081:8080 \
            --env PORT=8080 \
            --env FINAL_EXECUTION_AUTHORIZATION=false \
            --env LIVE_EXECUTION=BLOCKED \
            --env AURELIA_NON_PRODUCTION_SOAK=true \
            --env AURELIA_CONTINUOUS_RUNTIME=false \
            --env AURELIA_VERIFY_DERIV_PUBLIC=false \
            --env AURELIA_VERIFY_DERIV_AUTH=false \
            --env AURELIA_RUN_ONCE=false \
            aurelia-non-production-soak

      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -qx 'aurelia-non-production-soak'; then
              echo "RUNTIME_CONTAINER_EXITED_BEFORE_HEALTH"
              docker logs aurelia-non-production-soak 2>&1 || true
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/aurelia-startup-health.json 2>/tmp/aurelia-startup-health.err; then
              jq -e '
                (.liveness == true) and
                (.capital_can_open_new_exposure == false) and
                (.state == "CAPITAL_PROTECTED" or .state == "SELF_CHECK" or .state == "BOOT")
              ' /tmp/aurelia-startup-health.json >/dev/null
              echo "RUNTIME_HEALTH_READY attempt=${attempt}"
              exit 0
            fi

            sleep 2
          done

          echo "RUNTIME_HEALTH_TIMEOUT"
          cat /tmp/aurelia-startup-health.err 2>/dev/null || true
          docker logs aurelia-non-production-soak 2>&1 || true
          exit 1

      - name: Execute 3600-second control-path soak
        shell: bash
        run: |
          set -euo pipefail

          start_epoch="$(date +%s)"
          end_epoch=$((start_epoch + SOAK_SECONDS))
          checks=0
          restarts=0
          failures=0
          next_restart=$((start_epoch + 900))

          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            now="$(date +%s)"
            elapsed=$((now - start_epoch))
            checks=$((checks + 1))

            if ! curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/aurelia-health.json; then
              failures=$((failures + 1))
              echo "HEALTH_CHECK_FAILED elapsed=${elapsed}s"
              cat /tmp/aurelia-health.json 2>/dev/null || true
              docker logs aurelia-non-production-soak 2>&1 | tail -100 || true
              exit 1
            fi

            jq -e '
              (.liveness == true) and
              (.capital_can_open_new_exposure == false) and
              (.state == "CAPITAL_PROTECTED" or .state == "SELF_CHECK" or .state == "BOOT")
            ' /tmp/aurelia-health.json >/dev/null

            if [ "$now" -ge "$next_restart" ] && [ "$now" -lt "$end_epoch" ]; then
              echo "CONTROLLED_RESTART elapsed=${elapsed}s"
              docker restart aurelia-non-production-soak >/tmp/aurelia-restart.log
              restarts=$((restarts + 1))
              sleep 10

              if ! curl --fail --silent --show-error --retry 10 --retry-delay 1 http://127.0.0.1:18081/health >/tmp/aurelia-post-restart-health.json; then
                echo "POST_RESTART_HEALTH_FAILED elapsed=${elapsed}s"
                docker logs aurelia-non-production-soak 2>&1 | tail -100 || true
                exit 1
              fi

              jq -e '
                (.liveness == true) and
                (.capital_can_open_new_exposure == false)
              ' /tmp/aurelia-post-restart-health.json >/dev/null

              next_restart=$((next_restart + 900))
            fi

            if [ $((checks % 60)) -eq 0 ]; then
              echo "SOAK_PROGRESS elapsed=${elapsed}s checks=${checks} restarts=${restarts}"
            fi

            sleep 5
          done

          final_epoch="$(date +%s)"
          duration=$((final_epoch - start_epoch))

          source_commit="$GITHUB_SHA"
          runtime_image_id="$(docker image inspect aurelia-non-production-soak --format "{{.Id}}")"

          jq -n \
            --arg source_commit "$source_commit" \
            --arg runtime_image_id "$runtime_image_id" \
            --argjson duration "$duration" \
            --argjson checks "$checks" \
            --argjson restarts "$restarts" \
            --argjson failures "$failures" \
            '{
              source_commit: $source_commit,
              runtime_image_id: $runtime_image_id,
              evidence_type: "NON_PRODUCTION_3600S_CONTROL_PATH_SOAK",
              classification: "SIMULATION_VERIFIED",
              duration_seconds: $duration,
              target_seconds: 3600,
              health_checks: $checks,
              controlled_restarts: $restarts,
              health_check_failures: $failures,
              authenticated_deriv_session: false,
              real_broker_transaction: false,
              real_capital_movement: false,
              final_execution_authorization: false,
              live_execution: "BLOCKED",
              capital_can_open_new_exposure: false
            }' > aurelia-3600s-soak-evidence.json

          test "$duration" -ge 3600
          test "$failures" -eq 0

      - name: Assert capital protection
        if: always()
        run: |
          test "$FINAL_EXECUTION_AUTHORIZATION" = "false"
          test "$LIVE_EXECUTION" = "BLOCKED"
          if docker ps --format '{{.Names}}' | grep -qx 'aurelia-non-production-soak'; then
            docker inspect aurelia-non-production-soak --format 'container_running={{.State.Running}}'
          fi

      - name: Collect runtime diagnostics
        if: always()
        run: |
          docker logs aurelia-non-production-soak > aurelia-runtime.log 2>&1 || true
          docker inspect aurelia-non-production-soak > aurelia-runtime-inspect.json 2>&1 || true
          docker rm -f aurelia-non-production-soak >/dev/null 2>&1 || true

      - name: Upload non-production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-non-production-3600s-soak-evidence
          path: |
            aurelia-3600s-soak-evidence.json
            aurelia-runtime.log
            aurelia-runtime-inspect.json
            /tmp/aurelia-source-identity.env
            /tmp/aurelia-startup-health.json
            /tmp/aurelia-startup-health.err
          if-no-files-found: warn
          retention-days: 14
